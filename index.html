<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAM Insight — Substation Engineer</title>
<meta name="description" content="เกมจำลองงานวิศวกรดูแลหม้อแปลงไฟฟ้า สถานีคอต่อ (KO) และแพรกษา (PR) — Reliability / Availability / Maintainability">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06121f;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#e6f1fb;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.panel{background:rgba(4,44,83,.88);border:1px solid rgba(133,183,235,.25);border-radius:10px}
button{font-family:inherit;cursor:pointer;border:1px solid rgba(133,183,235,.45);background:#185fa5;color:#e6f1fb;border-radius:8px;padding:8px 14px;font-size:14px}
button:hover{background:#2470bb}
button.gold{background:#fac775;color:#633806;border-color:#fac775;font-weight:700}
button.gold:hover{background:#ffd78f}
button.ghost{background:transparent}
button.on{background:#fac775;color:#633806;border-color:#fac775}
input,select{font-family:inherit;font-size:14px;padding:7px 9px;border-radius:7px;border:1px solid rgba(133,183,235,.45);background:#0c2a4a;color:#e6f1fb}
/* select screen */
#select{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 14px;pointer-events:none}
#select>*{pointer-events:auto}
#select h1{font-size:26px;font-weight:700;text-align:center}
#select .sub{color:#85b7eb;font-size:13px;text-align:center;margin-top:4px}
#selBottom{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:520px}
#selCards{display:flex;gap:12px;width:100%}
#selCards button{flex:1;padding:12px;font-size:15px}
#selName{width:100%;text-align:center}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .panel{position:absolute;padding:8px 12px;pointer-events:auto}
#tl{top:10px;left:10px;min-width:200px}
#tl .big{font-size:16px;font-weight:700}
#tl .small,#tr .small{font-size:12px;color:#85b7eb}
#tr{top:10px;right:10px;text-align:right;min-width:200px}
#speed{top:78px;left:10px;display:flex;gap:4px;padding:5px!important}
#speed button{padding:4px 9px;font-size:12px}
#alert{top:10px;left:50%;transform:translateX(-50%);background:#a32d2d!important;border-color:#e24b4a!important;max-width:44vw;text-align:center;font-size:13px;font-weight:500}
#avail{left:10px;bottom:10px;width:230px;font-size:12px}
#avail .row{display:flex;align-items:center;gap:6px;margin-top:4px}
#avail .bar{flex:1;height:8px;border-radius:4px;background:#185fa5;overflow:hidden}
#avail .bar i{display:block;height:100%;border-radius:4px}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);padding:8px 14px;font-size:14px}
#prompt b{display:inline-block;background:#fac775;color:#633806;border-radius:5px;padding:0 7px;margin-right:6px}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #000}
#keys{right:10px;bottom:10px;font-size:12px;color:#b5d4f4;line-height:1.7}
#keys b{color:#fac775}
#toasts{position:absolute;top:120px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:rgba(4,44,83,.92);border-left:4px solid #fac775;padding:7px 12px;border-radius:6px;font-size:13px;max-width:320px;animation:fade 5s forwards}
.toast.bad{border-color:#e24b4a}.toast.good{border-color:#97c459}
@keyframes fade{0%{opacity:0;transform:translateX(20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* mobile controls */
#joy{position:absolute;left:24px;bottom:150px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(250,199,117,.85)}
#mbtns{position:absolute;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(2,70px);gap:8px;pointer-events:auto}
#mbtns button{height:56px;padding:4px;font-size:13px;border-radius:12px;background:rgba(24,95,165,.9)}
#mbtns button.gold{background:#fac775}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,12,24,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
#modal .box{width:min(820px,100%);max-height:92vh;overflow:auto;padding:18px 20px;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#modal h2{font-size:20px;margin-bottom:6px}
#modal h3{font-size:15px;margin:14px 0 6px;color:#fac775}
#modal p,#modal li{font-size:14px;line-height:1.7}
#modal ul{padding-left:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{padding:6px 11px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid rgba(133,183,235,.18);text-align:left;white-space:nowrap}
th{color:#85b7eb;font-weight:500}
.tw{overflow-x:auto}
.ok{color:#97c459}.bad{color:#f09595}.warn{color:#fac775}.mut{color:#85b7eb}
.card{background:rgba(12,68,124,.55);border:1px solid rgba(133,183,235,.2);border-radius:10px;padding:12px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.grid2 label{font-size:12px;color:#85b7eb;display:block;margin-bottom:3px}
.grid2 input,.grid2 select{width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid rgba(133,183,235,.25);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px}
.opt input{margin-top:5px}
.err{color:#f09595;font-size:13px;margin-top:6px;min-height:18px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.prog{height:8px;background:#0c2a4a;border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:#fac775}
.read{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.read div{background:#0c2a4a;border-radius:8px;padding:8px;text-align:center;font-size:12px;color:#85b7eb}
.read b{display:block;font-size:16px;color:#e6f1fb}
.grade{font-size:56px;font-weight:700;color:#fac775;line-height:1}
@media (max-width:700px){
 #tl,#tr{min-width:0;padding:6px 9px}#tl .big{font-size:14px}
 #alert{top:auto;bottom:250px;max-width:80vw}
 #avail{top:120px;bottom:auto;left:10px;width:170px;font-size:11px}
 #speed{top:auto;bottom:10px;left:50%;transform:translateX(-50%)}
 #keys{display:none}
 .read{grid-template-columns:repeat(2,1fr)}
 .grid2{grid-template-columns:1fr}
 #toasts{top:auto;bottom:300px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="select">
  <div>
    <h1>RAM Insight · Substation Engineer</h1>
    <div class="sub">เกมจำลองงานวิศวกรดูแลหม้อแปลงไฟฟ้า · สถานีคอต่อ (KO) · สถานีแพรกษา (PR) · นิคมอุตสาหกรรมบางปู</div>
  </div>
  <div id="selBottom">
    <div id="selCards">
      <button id="pickF" class="on">วิศวกรหญิง</button>
      <button id="pickM">วิศวกรชาย</button>
    </div>
    <input id="selName" maxlength="24" placeholder="ชื่อวิศวกร">
    <button id="startBtn" class="gold" style="width:100%;padding:12px;font-size:16px">เริ่มกะงาน</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="tl" class="panel"><div class="big" id="hDate">วันที่ 1 08:00</div><div class="small" id="hSta">สถานีคอต่อ (KO)</div></div>
  <div id="speed" class="panel">
    <button data-s="0">หยุด</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
  </div>
  <div id="tr" class="panel"><div class="big" id="hBud">฿ 0</div><div class="small" id="hTeam">-</div></div>
  <div id="alert" class="panel hidden"></div>
  <div id="avail" class="panel"></div>
  <div id="prompt" class="panel hidden"></div>
  <div id="keys" class="panel"><b>WASD</b> เดิน · <b>Shift</b> วิ่ง · <b>เมาส์</b> หันมอง<br><b>E</b> ตรวจหม้อแปลง · <b>Tab</b> แท็บเล็ต<br><b>V</b> สลับมุมมอง · <b>M</b> ย้ายสถานี · <b>P</b> หยุดเวลา</div>
  <div id="toasts"></div>
  <div id="joy" class="hidden"><div id="knob"></div></div>
  <div id="mbtns" class="hidden">
    <button id="bE" class="gold">ตรวจ</button><button id="bTab">แท็บเล็ต</button>
    <button id="bV">มุมมอง</button><button id="bM">ย้ายสถานี</button>
  </div>
</div>

<div id="modal" class="hidden"><div class="box panel" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const rand=(a,b)=>a+Math.random()*(b-a);
const expRand=m=>-Math.log(1-Math.random())*m;
const pad2=n=>String(n).padStart(2,'0');
function splitT(h){const d=Math.floor(h/24)+1;const r=h-(d-1)*24;let hh=Math.floor(r);let mm=Math.round((r-hh)*60);if(mm===60){mm=0;hh++;}return {d,hh,mm};}
function fmtT(h){const t=splitT(Math.min(h,YEAR-1/60));return `วันที่ ${t.d} ${pad2(t.hh)}:${pad2(t.mm)}`;}
const baht=n=>(n<0?'-':'')+'฿ '+Math.abs(Math.round(n)).toLocaleString('th-TH');
const pct=v=>(v*100).toFixed(2)+'%';

/* ================= GAME DATA ================= */
const YEAR=8760, HOURS_PER_SEC=7.5, LEAD_TIME=120, A_TARGET=0.96, FORM_DEADLINE=168;
const STA={KO:{x:-50,name:'สถานีไฟฟ้าย่อยคอต่อ',code:'KO'},PR:{x:50,name:'สถานีไฟฟ้าย่อยแพรกษา',code:'PR'}};
const TF_DEFS=[
 {id:'KO1',st:'KO',kv:'115/24 kV',mtbf:3000,lx:-15},
 {id:'KO2',st:'KO',kv:'115/24 kV',mtbf:2600,lx:0},
 {id:'KO3',st:'KO',kv:'115/24 kV',mtbf:3300,lx:15},
 {id:'PR1',st:'PR',kv:'115/24 kV',mtbf:2900,lx:-15},
 {id:'PR2',st:'PR',kv:'115/24 kV',mtbf:3200,lx:0},
 {id:'PR3',st:'PR',kv:'67-115/24 kV',mtbf:2300,lx:15},
];
const PARTS={
 oltc:{name:'ชุดมอเตอร์ขับ OLTC',price:180000},
 gasket:{name:'ชุดปะเก็น + น้ำมันหม้อแปลง',price:95000},
 buchholz:{name:'Buchholz relay + ชุดกรองน้ำมัน',price:140000},
 fan:{name:'มอเตอร์พัดลมระบายความร้อน',price:45000},
 bushing:{name:'บุชชิ่ง 115 kV',price:380000},
 arrester:{name:'Surge arrester 115 kV',price:85000},
};
const FAULTS=[
 {k:'oltc',name:'OLTC ขัดข้อง (ชุดขับมอเตอร์)',alarm:'Voltage regulation fail',part:'oltc',base:16,w:1.2,smoke:false,
  sym:['แรงดันด้าน 24 kV ต่ำกว่าเกณฑ์','OLTC ค้างที่ Tap 9 ไม่เปลี่ยนตามคำสั่ง','มีกลิ่นไหม้ที่ตู้ขับ OLTC'],read:{oil:62,wti:78,v:'21.6 kV',b:'ปกติ'}},
 {k:'leak',name:'น้ำมันรั่วที่ปะเก็น/วาล์ว',alarm:'Low oil level',part:'gasket',base:24,w:1.3,smoke:false,
  sym:['มีคราบน้ำมันใต้ถังและบนแท่นฐาน','ระดับน้ำมันใน Conservator ต่ำ','ซิลิกาเจลเปลี่ยนสีเร็วผิดปกติ'],read:{oil:68,wti:82,v:'24.1 kV',b:'Alarm'}},
 {k:'buch',name:'Buchholz relay ทำงาน (แก๊สสะสมในถัง)',alarm:'Main transformer trip',part:'buchholz',base:36,w:0.8,smoke:true,
  sym:['พบแก๊สสะสมในช่องรีเลย์ Buchholz','ผล DGA เบื้องต้นมี C2H2 สูง','ไม่พบรอยไหม้ภายนอก'],read:{oil:74,wti:88,v:'0 kV (Trip)',b:'Trip'}},
 {k:'fan',name:'พัดลมระบายความร้อนเสีย',alarm:'WTI high temperature',part:'fan',base:8,w:1.5,smoke:false,
  sym:['WTI ขึ้นถึง 118°C เกินค่าตั้ง','พัดลมชุดระบายความร้อนไม่หมุน','เบรกเกอร์มอเตอร์พัดลมตัด'],read:{oil:96,wti:118,v:'24.0 kV',b:'ปกติ'}},
 {k:'bush',name:'บุชชิ่งแรงสูงวาบไฟ/แตกร้าว',alarm:'Main transformer trip',part:'bushing',base:48,w:0.6,smoke:true,
  sym:['พบรอยไหม้และรอยร้าวที่บุชชิ่ง HV เฟส B','รีเลย์ Differential (87T) ทำงาน','Buchholz ไม่ทำงาน'],read:{oil:70,wti:84,v:'0 kV (Trip)',b:'ปกติ'}},
 {k:'arr',name:'Surge arrester เสียหายจากฟ้าผ่า',alarm:'Earth fault trip',part:'arrester',base:12,w:1.0,smoke:true,
  sym:['เคาน์เตอร์ Surge arrester เพิ่มขึ้นหลังพายุฝน','ฉนวนอาร์เรสเตอร์ร้าว มีรอยดำ','รีเลย์ Earth fault ทำงาน'],read:{oil:60,wti:72,v:'0 kV (Trip)',b:'ปกติ'}},
];
const NORMAL_READ={oil:55,wti:68,v:'24.0 kV',b:'ปกติ'};

/* ================= RENDERER / SCENES ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch});
renderer.setPixelRatio(Math.min(devicePixelRatio,isTouch?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const M=(color,o={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.8,metalness:.1},o));
function box(w,h,d,mat,x,y,z,parent,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true;}if(parent)parent.add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,parent,seg=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
function noiseTex(base,amt,rep,size=256){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,size,size);
 for(let i=0;i<size*size/5;i++){const v=Math.random();x.fillStyle=v>.5?`rgba(255,255,255,${(v-.5)*amt})`:`rgba(0,0,0,${(.5-v)*amt})`;x.fillRect(Math.random()*size,Math.random()*size,2+Math.random()*2,2+Math.random()*2);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);return t;}
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.lineTo(X+W-R,Y);x.quadraticCurveTo(X+W,Y,X+W,Y+R);x.lineTo(X+W,Y+H-R);x.quadraticCurveTo(X+W,Y+H,X+W-R,Y+H);x.lineTo(X+R,Y+H);x.quadraticCurveTo(X,Y+H,X,Y+H-R);x.lineTo(X,Y+R);x.quadraticCurveTo(X,Y,X+R,Y);x.closePath();}
function makeLabel(w=512,h=160){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.userData={c,t};return s;}
function drawLabel(s,title,sub,col){const {c,t}=s.userData;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);rr(x,8,8,c.width-16,c.height-16,24);x.fillStyle='rgba(4,44,83,0.85)';x.fill();x.lineWidth=6;x.strokeStyle=col;x.stroke();
 x.textAlign='center';x.fillStyle='#ffffff';x.font='700 58px "Noto Sans Thai",sans-serif';x.fillText(title,c.width/2,74);x.fillStyle=col;x.font='500 38px "Noto Sans Thai",sans-serif';x.fillText(sub,c.width/2,130);t.needsUpdate=true;}
function signPlane(w,h,draw,cw=1024,ch=512){const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');draw(x,cw,ch);const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,roughness:.6}));m.userData={c,draw,t};return m;}

/* ---------- Character ---------- */
function makeCharacter(g,opt={}){
 const skin=opt.skin||(g==='f'?0xf0b49a:0xc98a64);
 const grp=new THREE.Group();
 const vestM=M(0xff8c1a),pantsM=M(0x26324a),shirtM=M(opt.shirt||0x2f5f9e),refl=M(0xf4f4ee,{emissive:0x444444}),shoeM=M(0x1e1e1e),skinM=M(skin),hairM=M(g==='f'?0x2a1a10:0x1c1410),helmM=M(opt.helm||(g==='f'?0xf6f6f2:0xf2c230),{roughness:.35});
 const tw=g==='f'?0.42:0.48;
 const mkLeg=x=>{const p=new THREE.Group();p.position.set(x,0.95,0);box(0.16,0.88,0.18,pantsM,0,-0.44,0,p);box(0.18,0.1,0.3,shoeM,0,-0.9,0.05,p);grp.add(p);return p;};
 const legL=mkLeg(-0.12),legR=mkLeg(0.12);
 box(tw-0.02,0.62,0.24,shirtM,0,1.26,0,grp);
 box(tw,0.56,0.27,vestM,0,1.24,0,grp);
 box(tw+0.01,0.05,0.28,refl,0,1.12,0,grp);box(tw+0.01,0.05,0.28,refl,0,1.32,0,grp);
 const mkArm=x=>{const p=new THREE.Group();p.position.set(x,1.52,0);box(0.13,0.58,0.15,shirtM,0,-0.29,0,p);box(0.11,0.12,0.12,skinM,0,-0.64,0,p);grp.add(p);return p;};
 const armL=mkArm(-(tw/2+0.08)),armR=mkArm(tw/2+0.08);
 cyl(0.06,0.07,0.1,skinM,0,1.6,0,grp);
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.14,20,16),skinM);head.scale.set(1,1.12,1);head.position.set(0,1.73,0);head.castShadow=true;grp.add(head);
 const eyeM=M(0x111111);[-0.05,0.05].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.018,8,8),eyeM);e.position.set(x,1.75,0.13);grp.add(e);});
 const hairCap=new THREE.Mesh(new THREE.SphereGeometry(0.148,20,12,0,Math.PI*2,0,Math.PI/1.8),hairM);hairCap.position.set(0,1.75,-0.01);grp.add(hairCap);
 if(g==='f'){box(0.26,0.26,0.08,hairM,0,1.62,-0.11,grp);const tail=box(0.09,0.28,0.09,hairM,0,1.55,-0.18,grp);tail.rotation.x=0.25;}
 const helm=new THREE.Mesh(new THREE.SphereGeometry(0.17,20,12,0,Math.PI*2,0,Math.PI/2),helmM);helm.position.set(0,1.8,0);helm.castShadow=true;grp.add(helm);
 cyl(0.2,0.2,0.02,helmM,0,1.8,0.02,grp,20);
 grp.traverse(o=>{if(o.isMesh)o.castShadow=true;});
 return {grp,legL,legR,armL,armR,skinM};
}

/* ---------- Select scene ---------- */
const selScene=new THREE.Scene();selScene.background=new THREE.Color(0x0c2a4a);

}
function recStats(tf){
 const T=Math.max(gameH,1);const fs=forms.filter(f=>f.tf===tf.id&&f.submitted);const down=fs.reduce((a,f)=>a+Math.max(0,f.rec.end-f.rec.start),0);
 const up=T-down;const n=fs.length;const mtbf=n?up/n:null;const mttr=n?down/n:null;
 return {n,down,A:up/T,mtbf,mttr,R:mtbf?Math.exp(-720/mtbf):1,Mt:mttr&&mttr>0?1-Math.exp(-24/mttr):null};
}

function nearestTf(){let best=null,bd=1e9;for(const tf of tfs){const nx=Math.max(tf.cx-3.75,Math.min(player.pos.x,tf.cx+3.75)),nz=Math.max(tf.cz-2.75,Math.min(player.pos.z,tf.cz+2.75));const d=Math.hypot(player.pos.x-nx,player.pos.z-nz);if(d<bd){bd=d;best=tf;}}return bd<2.4?best:null;}

window.dispatch=function(id){
 const tf=tfs.find(t=>t.id===id);const dg=document.querySelector('input[name=dg]:checked'),tm=document.querySelector('input[name=tm]:checked');
 if(!dg){$('dErr').textContent='เลือกสาเหตุที่วินิจฉัยก่อน';return;}
 if(!tm){$('dErr').textContent='เลือกทีมช่างก่อน';return;}
 const f=tf.fault,diag=FAULTS.find(x=>x.k===dg.value),team=teams.find(t=>t.id===tm.value);
 const wrong=diag!==f;let cost=0,lead=0;
 if(stock[f.part]>0){stock[f.part]--;}else{cost+=PARTS[f.part].price*1.5;lead=LEAD_TIME;}
 const work=f.base*rand(0.85,1.2)*(wrong?1.6:1);
 cost+=20000+work*1800+(wrong?40000:0);
 const start=Math.max(gameH,team.freeAt)+2;const end=start+work+lead;
 tf.status='repair';tf.repairStart=start;tf.repairEnd=end;tf.team=team.id;tf.wrongDiag=wrong;tf.diagnosedName=diag.name;
 team.freeAt=end;team.job=tf.id;budget-=cost;
 logEv(`${tf.id} ส่งทีม ${team.id} ซ่อม (วินิจฉัย: ${diag.name})`,'info');
 toast(`ส่งทีม ${team.id} ไป ${tf.id} · ค่าใช้จ่าย ${baht(cost)}${lead?' · รออะไหล่ '+lead+' ชม.':''}`,lead?'bad':'');
 if(wrong)setTimeout(()=>toast(`ช่างแจ้ง: ${tf.id} สาเหตุไม่ตรงที่วินิจฉัย ต้องตรวจซ้ำ`,'bad'),1500);
 updateTfVisual(tf);closeModal();
};

window.submitForm=function(id){
 const f=forms.find(x=>x.id===id);const g=k=>$(k+id).value;const e=$('fe'+id);
 const sd=parseInt(g('sd'),10),ed=parseInt(g('ed'),10),st=g('st'),et=g('et'),cs=g('cs');
 if(!sd||!ed||!st||!et||!cs){e.textContent='กรอกให้ครบทุกช่อง';return;}
 if(sd<1||sd>365||ed<1||ed>365){e.textContent='วันที่ต้องอยู่ระหว่าง 1–365';return;}
 const toH=(d,t)=>{const [hh,mm]=t.split(':').map(Number);return (d-1)*24+hh+mm/60;};
 const s=toH(sd,st),en=toH(ed,et);
 if(en<s){e.textContent='เวลาสิ้นสุดต้องไม่อยู่ก่อนเวลาเริ่ม';return;}
 f.rec={start:s,end:en,cause:cs};f.submitted=true;f.flag=Math.abs(en-s)<0.01;
 f.accurate=Math.abs(s-f.trueStart)<=0.5&&Math.abs(en-f.trueEnd)<=0.5&&cs===f.trueCause;
 logEv(`ส่งใบ FM-OPR-06-01 #${f.id} (${f.tf})`);toast(f.accurate?`ใบ #${f.id} ข้อมูลถูกต้อง`:`ใบ #${f.id} ข้อมูลไม่ตรงกับเหตุการณ์จริง`,f.accurate?'good':'bad');openTablet('forms');
};

addEventListener('keyup',e=>{keys[e.code]=false;});
canvas.addEventListener('click',()=>{if(state==='play'&&!uiOpen&&!isTouch&&!document.pointerLockElement)canvas.requestPointerLock();});
addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&!uiOpen){player.yaw-=e.movementX*0.0022;player.pitch=Math.max(-1.3,Math.min(1.2,player.pitch-e.movementY*0.0022));}});
function setSpeed(s){speed=s;document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));}
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.s)));
function switchStation(){const cur=player.pos.x<0?'KO':'PR',to=cur==='KO'?'PR':'KO';player.pos.set(STA[to].x,0,27);player.yaw=0;gameH+=1;toast(`ขับรถไป${STA[to].name} (ใช้เวลา 1 ชม.)`);}
// touch
let joyId=null,joyV={x:0,y:0},lookId=null,lookLast=null;
const joy=$('joy'),knob=$('knob');
joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;moveJoy(t);},{passive:false});
function moveJoy(t){const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60);const d=Math.hypot(dx,dy);if(d>50){dx*=50/d;dy*=50/d;}knob.style.left=(35+dx)+'px';knob.style.top=(35+dy)+'px';joyV={x:dx/50,y:dy/50};}
addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joyId)moveJoy(t);else if(t.identifier===lookId&&!uiOpen){player.yaw-=(t.clientX-lookLast.x)*0.006;player.pitch=Math.max(-1.3,Math.min(1.2,player.pitch-(t.clientY-lookLast.y)*0.006));lookLast={x:t.clientX,y:t.clientY};}}},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===joyId){joyId=null;joyV={x:0,y:0};knob.style.left='35px';knob.style.top='35px';}if(t.identifier===lookId)lookId=null;}});
canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX>innerWidth*0.35&&lookId===null){lookId=t.identifier;lookLast={x:t.clientX,y:t.clientY};}}},{passive:true});
$('bE').onclick=()=>{if(uiOpen)return;const tf=nearestTf();if(tf)openInspect(tf);else toast('เดินเข้าไปใกล้หม้อแปลงก่อน');};
$('bTab').onclick=()=>{if(!uiOpen)openTablet();};
$('bV').onclick=()=>{player.third=!player.third;};
$('bM').onclick=()=>{if(!uiOpen)switchStation();};

/* ---------- Select screen ---------- */
function pickGender(g){gender=g;$('pickF').classList.toggle('on',g==='f');$('pickM').classList.toggle('on',g==='m');}
$('pickF').onclick=()=>pickGender('f');$('pickM').onclick=()=>pickGender('m');
$('startBtn').onclick=()=>{
 playerName=$('selName').value.trim();
 playerChar=makeCharacter(gender);scene.add(playerChar.grp);
 const skin=gender==='f'?0xf0b49a:0xc98a64;fpHandM.color.set(skin);
 tfs.forEach(tf=>{tf.nextFail=gameH+expRand(tf.mtbf)*0.6+24;updateTfVisual(tf);});
 $('select').classList.add('hidden');$('hud').classList.remove('hidden');
 if(isTouch){$('joy').classList.remove('hidden');$('mbtns').classList.remove('hidden');}
 state='play';showBrief();
};

/* ================= HUD ================= */
let hudT=0;
function updateHUD(){
 $('hDate').textContent=fmtT(gameH);
 const cur=player.pos.x<0?'KO':'PR';$('hSta').textContent=`${STA[cur].name} (${cur})`;
 $('hBud').textContent=baht(budget);$('hBud').style.color=budget<0?'#f09595':'';
 $('hTeam').textContent=teams.map(t=>`ทีม ${t.id} ${t.freeAt>gameH?'ไม่ว่าง':'ว่าง'}`).join(' · ')+' · ใบค้าง '+forms.filter(f=>!f.submitted).length;
 $('avail').innerHTML='<b>Availability (เป้า 96%)</b>'+tfs.map(tf=>{const a=stats(tf).A;const c=a>=0.98?'#97c459':a>=A_TARGET?'#ef9f27':'#e24b4a';const w=Math.max(0,Math.min(1,(a-0.9)/0.1));const dot=tf.status==='ok'?'':tf.status==='fault'?' <span class="bad">●</span>':' <span class="warn">●</span>';
  return `<div class="row"><span style="width:30px">${tf.id}</span><div class="bar"><i style="width:${w*100}%;background:${c}"></i></div><span style="width:52px;text-align:right">${(a*100).toFixed(1)}%</span>${dot}</div>`;}).join('');
 const pend=tfs.filter(t=>t.status==='fault');
 if(pend.length){$('alert').classList.remove('hidden');$('alert').textContent=`เหตุขัดข้อง: ${pend.map(t=>t.id+' ('+t.fault.alarm+')').join(', ')} · เวลาเดินช้าลงจนกว่าจะสั่งซ่อม`;}else $('alert').classList.add('hidden');
}

/* ================= LOOP ================= */
const clock=new THREE.Clock();
let blink=0;
function tick(){
 requestAnimationFrame(tick);
 const dt=Math.min(clock.getDelta(),0.1);blink+=dt;
 if(state==='select'){
  selF.grp.rotation.y+=dt*(gender==='f'?1.2:0.25);selMch.grp.rotation.y+=dt*(gender==='m'?1.2:0.25);
  rings.f.visible=gender==='f';rings.m.visible=gender==='m';
  renderer.render(selScene,selCam);return;
 }
 // time
 if(state==='play'&&!uiOpen){
  const slow=tfs.some(t=>t.status==='fault')?0.2:1;
  gameH=Math.min(YEAR,gameH+dt*HOURS_PER_SEC*speed*slow);
  for(const tf of tfs){if(gameH>=YEAR)break;
   if(tf.status==='ok'&&gameH>=tf.nextFail)failTf(tf);
   else if(tf.status==='repair'&&gameH>=tf.repairEnd)restoreTf(tf);
  }
  teams.forEach(t=>{if(t.job){const tf=tfs.find(x=>x.id===t.job);if(tf&&tf.status==='repair'&&gameH>=tf.repairStart&&t.atJobId!==tf.id)placeTeamAtJob(t,tf);if(!tf||tf.status!=='repair'||tf.team!==t.id){if(t.freeAt<=gameH){t.job=null;parkTeam(t);}}}});
  forms.forEach(f=>{if(!f.submitted&&gameH-f.created>FORM_DEADLINE){f.submitted=true;f.auto=true;f.rec={start:f.trueEnd,end:f.trueEnd,cause:'ไม่ระบุ'};f.flag=true;f.accurate=false;logEv(`ใบ #${f.id} (${f.tf}) เกินกำหนด ช่างกรอกแทน: from = to, สาเหตุไม่ระบุ`,'bad');toast(`ใบ #${f.id} เกินกำหนด — ข้อมูลถูกบันทึกแบบไม่สมบูรณ์`,'bad');}});
  if(gameH>=YEAR&&state==='play'){gameH=YEAR;endGame();}
 }
 // movement
 const p=player;let moving=false;
 if(state==='play'&&!uiOpen){
  let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA||keys.ArrowLeft)s-=1;if(keys.KeyD||keys.ArrowRight)s+=1;
  f-=joyV.y;s+=joyV.x;
  const len=Math.hypot(f,s);if(len>0.05){moving=true;const sp=(keys.ShiftLeft||keys.ShiftRight||len>0.95&&isTouch?6.5:3.6)*Math.min(1,len);f/=Math.max(1,len);s/=Math.max(1,len);
   const fx=-Math.sin(p.yaw),fz=-Math.cos(p.yaw);p.pos.x+=(fx*f+(-fz)*s)*sp*dt;p.pos.z+=(fz*f+fx*s)*sp*dt;
   collide(p.pos);p.pos.x=Math.max(-112,Math.min(112,p.pos.x));p.pos.z=Math.max(-62,Math.min(70,p.pos.z));p.walkT+=dt*sp*2.2;}
 }
 if(playerChar){
  const c=playerChar;c.grp.position.copy(p.pos);c.grp.rotation.y=p.yaw+Math.PI;const sw=moving?Math.sin(p.walkT)*0.6:0;
  c.legL.rotation.x=sw;c.legR.rotation.x=-sw;c.armL.rotation.x=-sw*0.8;c.armR.rotation.x=sw*0.8;
  c.grp.visible=p.third||state==='end';fpArm.visible=!p.third&&state==='play';
  fpArm.position.y=-0.02+(moving?Math.abs(Math.sin(p.walkT))*0.012:0);
 }
 if(state==='end'){const a=blink*0.25;camera.position.set(p.pos.x+Math.sin(a)*5,2.6,p.pos.z+Math.cos(a)*5);camera.lookAt(p.pos.x,1.3,p.pos.z);}
 else if(p.third){const fx=-Math.sin(p.yaw),fz=-Math.cos(p.yaw);camera.position.set(p.pos.x-fx*4.2,p.pos.y+2.4-p.pitch*1.5,p.pos.z-fz*4.2);camera.rotation.set(p.pitch*0.6-0.2,p.yaw,0);}
 else{camera.position.set(p.pos.x,1.65,p.pos.z);camera.rotation.set(p.pitch,p.yaw,0);}
 // day/night
 const hd=gameH%24,sunUp=Math.max(0,Math.sin((hd-6)/12*Math.PI));
 const sky=skyNight.clone().lerp(skyDay,sunUp);if(sunUp>0&&sunUp<0.35)sky.lerp(skyDusk,(0.35-sunUp)*1.2);
 scene.background.copy(sky);scene.fog.color.copy(sky);
 sun.intensity=0.15+0.95*sunUp;hemi.intensity=0.35+0.4*sunUp;
 const ang=(hd-6)/12*Math.PI;sun.position.set(Math.cos(ang)*80,20+Math.max(0,Math.sin(ang))*80,40);
 lamps.forEach(l=>l.material.emissiveIntensity=sunUp<0.15?1.5:0);
 // transformer fx
 for(const tf of tfs){
  if(tf.status==='fault')tf.lampM.emissiveIntensity=(Math.sin(blink*8)>0)?1.6:0.15;else tf.lampM.emissiveIntensity=1;
  const spin=tf.status==='ok';tf.fans.forEach(f=>{if(spin)f.rotation.x+=dt*14;});
  if(tf.status!=='ok'&&tf.fault&&tf.fault.smoke&&gameH<tf.repairEnd+1){tf.smokeT+=dt;if(tf.smokeT>0.18&&(tf.status==='fault'||gameH<tf.repairStart+3)){tf.smokeT=0;spawnPuff(tf);}}
 }
 for(let i=puffs.length-1;i>=0;i--){const q=puffs[i];q.life+=dt;q.sp.position.y+=dt*1.3;q.sp.position.x+=dt*0.4;const sc=1+q.life*1.2;q.sp.scale.set(sc,sc,1);q.sp.material.opacity=Math.max(0,0.8-q.life*0.27);if(q.life>3){scene.remove(q.sp);q.sp.material.dispose();puffs.splice(i,1);}}
 teams.forEach(t=>{t.truck.bm.emissiveIntensity=t.atJob&&Math.sin(blink*10)>0?2:0;const w=t.worker;if(t.atJob){w.armR.rotation.x=-1.2+Math.sin(blink*6)*0.4;w.armL.rotation.x=-0.6;}else{w.armR.rotation.x=0;w.armL.rotation.x=0;}});
 // prompt
 if(state==='play'&&!uiOpen){const tf=nearestTf();if(tf){$('prompt').classList.remove('hidden');$('prompt').innerHTML=`<b>${isTouch?'ตรวจ':'E'}</b>ตรวจหม้อแปลง ${tf.id}`;}else $('prompt').classList.add('hidden');}
 else $('prompt').classList.add('hidden');
 hudT+=dt;if(hudT>0.25&&state!=='select'){hudT=0;updateHUD();}
 renderer.render(scene,camera);
}
function collide(q){const r=0.4;for(const b of colliders){const nx=Math.max(b.x1,Math.min(q.x,b.x2)),nz=Math.max(b.z1,Math.min(q.z,b.z2));const dx=q.x-nx,dz=q.z-nz,d2=dx*dx+dz*dz;
 if(d2<r*r){if(d2>1e-8){const d=Math.sqrt(d2);q.x=nx+dx/d*r;q.z=nz+dz/d*r;}else{const l=q.x-b.x1,R=b.x2-q.x,t=q.z-b.z1,B=b.z2-q.z,m=Math.min(l,R,t,B);if(m===l)q.x=b.x1-r;else if(m===R)q.x=b.x2+r;else if(m===t)q.z=b.z1-r;else q.z=b.z2+r;}}}}

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitSelCam();});
function redrawSigns(){scene.traverse(o=>{if(o.userData&&o.userData.draw){const x=o.userData.c.getContext('2d');x.clearRect(0,0,o.userData.c.width,o.userData.c.height);o.userData.draw(x,o.userData.c.width,o.userData.c.height);o.userData.t.needsUpdate=true;}});tfs.forEach(updateTfVisual);}
tfs.forEach(updateTfVisual);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawSigns);
tick();
</script>
</body>
</html>
