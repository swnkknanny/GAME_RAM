<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06121f;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#e6f1fb;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.panel{background:rgba(4,44,83,.88);border:1px solid rgba(133,183,235,.25);border-radius:10px}
button{font-family:inherit;cursor:pointer;border:1px solid rgba(133,183,235,.45);background:#185fa5;color:#e6f1fb;border-radius:8px;padding:8px 14px;font-size:14px}
button:hover{background:#2470bb}
button.gold,button.on{background:#fac775;color:#633806;border-color:#fac775;font-weight:700}
button.gold:hover{background:#ffd78f}
button.red{background:#a32d2d;border-color:#e24b4a}
button.green{background:#3b6d11;border-color:#639922}
button.ghost{background:transparent}
button.sm{padding:4px 9px;font-size:12px}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border-radius:7px;border:1px solid rgba(133,183,235,.45);background:#0c2a4a;color:#e6f1fb}
input[type=range]{padding:0}
/* select */
#select{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 14px;pointer-events:none}
#select>*{pointer-events:auto}
#select h1{font-size:26px;font-weight:700;text-align:center}
#select .sub{color:#85b7eb;font-size:13px;text-align:center;margin-top:4px}
#selBottom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:520px}
.row2{display:flex;gap:10px;width:100%}.row2>*{flex:1}
#selName{width:100%;text-align:center}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .panel{position:absolute;padding:8px 12px;pointer-events:auto}
#tl{top:10px;left:10px;min-width:230px}
#tl .big{font-size:16px;font-weight:700}
.small{font-size:12px;color:#85b7eb}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-top:4px}
.chip.in{background:#3b6d11;color:#eaf3de}.chip.out{background:#5f5e5a;color:#f1efe8}
#needs{top:86px;left:10px;width:230px;font-size:12px}
.nrow{display:flex;align-items:center;gap:6px;margin-top:3px}
.nrow span:first-child{width:52px}

  if(hor)box(len,hh,T,mat,ox+mid,y0+hh/2,oz+z1,scene);else box(T,hh,len,mat,ox+x1,y0+hh/2,oz+mid,scene);
  if(y0===0){if(hor)addCol(ox+mid,oz+z1,len/2,T/2);else addCol(ox+x1,oz+mid,T/2,len/2);}};
 dr.slice().sort((p,q)=>p-q).forEach(c=>{piece(s,c-DW/2,0,h);piece(c-DW/2,c+DW/2,2.3,h);
  if(hor)makeDoor(true,ox+c-DW/2,oz+z1,DW,M(0x6b4a32));else makeDoor(false,ox+x1,oz+c-DW/2,DW,M(0x6b4a32));s=c+DW/2;});

/* ---------- timecard & pay ---------- */
function timecard(){
 const days=[];for(let d=1;d<=30;d++)days.push({d,work:isWork(d),first:null,last:null,ot:0,reg:0,late:false,absent:false,forgot:false});
 const present=t=>G.punches.some(p=>p.in<=t&&(p.out===null?G.h:p.out)>=t);
 G.punches.forEach(p=>{const out=p.out===null?G.h:p.out;
  for(let d=Math.floor(p.in/24)+1;d<=Math.min(30,Math.floor((out-1e-6)/24)+1);d++){const D=days[d-1];const s0=Math.max(p.in,(d-1)*24),s1=Math.min(out,d*24);if(s1<=s0)continue;
   if(D.first===null||s0<D.first)D.first=s0;if(D.last===null||s1>D.last)D.last=s1;
   const reg=D.work?Math.max(0,Math.min(s1,(d-1)*24+17)-Math.max(s0,(d-1)*24+8)):0;D.reg+=reg;if(!p.auto)D.ot+=(s1-s0)-reg;if(p.auto)D.forgot=true;}});
 days.forEach(D=>{const b=(D.d-1)*24;if(!D.work)return;
  const any=G.punches.some(p=>p.in<b+17&&(p.out===null?G.h:p.out)>b+8);
  if(!present(b+8+5/60)&&any&&G.h>b+8+5/60)D.late=true;
  if(!any&&G.h>b+17)D.absent=true;});
 const tot={ot:days.reduce((a,D)=>a+D.ot,0),late:days.filter(D=>D.late).length,absent:days.filter(D=>D.absent).length};
 return {days,tot};
}
function payslip(){const {tot}=timecard();const otPay=tot.ot*HOUR_RATE*1.5,lateDed=tot.late*200,absDed=tot.absent*BASE_SALARY/22,ssf=750,adv=G.pay.adv?BASE_SALARY/2:0;
 return {base:BASE_SALARY,otH:tot.ot,otPay,late:tot.late,lateDed,absent:tot.absent,absDed,ssf,adv,net:BASE_SALARY+otPay-lateDed-absDed-ssf-adv};}

function simulate(dh){
 const steps=Math.max(1,Math.ceil(dh/0.05));const s=dh/steps;
 for(let i=0;i<steps;i++){simStep(s);if(state!=='play')return;}
}
function simStep(dh){
 G.h+=dh;const h=G.h,N=G.needs,sl=!!G.sleeping;
 const atHome=locName().startsWith('บ้านพัก');
 const pending=G.tf.some(t=>t.status==='fault'||t.status==='done');
 if(sl){N.energy+=14*dh;N.food-=2.5*dh;N.stress-=5*dh;}
 else{N.food-=5*dh;N.energy-=(N.food<=0?8:5.5)*(N.stress>80?1.3:1)*dh;N.stress+=(pending?4:(atHome?-6:-1.5))*dh+(N.food<=0?6*dh:0);}
 N.food=clamp(N.food,0,100);N.energy=clamp(N.energy,0,100);N.stress=clamp(N.stress,0,100);
 if(sl&&h>=G.sleeping.until)wake('ตื่นนอนแล้ว');
 if(!sl&&N.energy<=0)collapse();
 // techs
 G.techs.forEach(t=>{t.fatigue=clamp(t.fatigue+(t.busy?6:-3)*dh,0,100);});
 // transformers
 for(const t of G.tf){
  if(t.status==='ok'&&h>=t.nextFail)failTf(t);
  else if(t.status==='fault'){
   if(!t.acked&&!t.reminded&&h-t.failAt>1){t.reminded=true;addMsg('หัวหน้า',`มี alarm ที่ ${t.id} ค้างมาเกิน 1 ชม. ยังไม่มีใครรับทราบ รีบไปดูที่ห้องควบคุมด้วย`,'bad');}
   if(!FK(t.fk).trip&&!t.esc&&(t.cb115||t.cb24)&&h-t.failAt>6){t.esc=true;t.cb115=false;t.cb24=false;logEv(`${t.id} TRIP — protection operated (fault ลุกลาม)`,'bad',t.id);addMsg('ระบบ SCADA',`${t.id} ทริปเพราะปล่อยเหตุไว้นาน ความเสียหายเพิ่มขึ้น`,'bad');beep(4);refreshTf(t);}
  }else if(t.status==='repair'&&h>=t.repairEnd)repairDone(t);
  if(!t.warned96&&h>START_H+72&&stats(t).A<A_TARGET){t.warned96=true;addMsg('หัวหน้า',`Availability ของ ${t.id} ต่ำกว่า 96% แล้ว ระวังด้วยนะ`,'bad');}
 }
 factorySim(dh);
 // forms deadline
 G.forms.forEach(f=>{if(!f.submitted&&h-f.created>FORM_DEADLINE){f.submitted=true;f.auto=true;f.rec={tf:f.tf,type:'CM',start:f.trueEnd,end:f.trueEnd,cause:'ไม่ระบุ'};f.flag=true;f.accurate=false;logEv(`ใบ #${f.id} (${f.tf}) เกินกำหนด ช่างกรอกแทน: from = to, สาเหตุไม่ระบุ`,'bad');addMsg('หัวหน้า',`ใบ FM-OPR-06-01 #${f.id} ไม่ส่งภายใน 3 วัน ข้อมูลที่ช่างกรอกแทนใช้วิเคราะห์ไม่ได้`,'bad');}});
 // punch forgot
 const lp=G.punches[G.punches.length-1];
 if(lp&&lp.out===null&&h-lp.in>16){const d=Math.floor(lp.in/24);lp.out=Math.max(lp.in+0.01,Math.min(lp.in+9,d*24+17));lp.auto=true;addMsg('ฝ่ายบุคคล','ลืมตอกบัตรออกงาน ระบบปิดบัตรให้อัตโนมัติ ไม่คิดค่าล่วงเวลาของรอบนั้น','bad');}
 // attendance messages
 const day=Math.floor(h/24)+1,b=(day-1)*24;
 if(isWork(day)&&h>b+8.25&&h<b+17&&!G.stats.lateMsg[day]){const pres=G.punches.some(p=>p.in<=b+8+5/60&&(p.out===null?h:p.out)>=b+8+5/60);if(!pres){G.stats.lateMsg[day]=1;addMsg('หัวหน้า','สายแล้วนะ วันนี้ยังไม่เห็นตอกบัตรเข้างานเลย','bad');}}
 if(isWork(day)&&h>b+17&&!G.stats.absMsg[day]){G.stats.absMsg[day]=1;const any=G.punches.some(p=>p.in<b+17&&(p.out===null?h:p.out)>b+8);if(!any)addMsg('ฝ่ายบุคคล',`วันที่ ${day} ไม่มีบันทึกเข้างาน นับเป็นขาดงาน`,'bad');}
 if(!G.pay.adv&&h>=14*24+17){G.pay.adv=true;G.wallet+=BASE_SALARY/2;addMsg('ฝ่ายบุคคล',`โอนเงินเดือนงวดแรก ${baht(BASE_SALARY/2)} เข้าบัญชีแล้ว`,'good');}
 if(h>=MONTH_H)endGame();
}
function failTf(t){
 const f=pickFault();Object.assign(t,{optOrder:null,status:'fault',fk:f.k,failAt:G.h,acked:false,diag:null,wrong:false,esc:false,reminded:false,crew:[]});t.fails++;
 if(f.trip){t.cb115=false;t.cb24=false;}
 logEv(`${t.id} ${f.trip?'TRIP':'ALARM'} — ${f.alarm}`,'bad',t.id);
 beep(4);if(G.sleeping)wake(`โทรศัพท์ปลุก! ${t.id} ${f.alarm}`);
 const hd=G.h%24,day=Math.floor(G.h/24)+1;const off=!isWork(day)||hd<8||hd>=17;
 addMsg('ระบบ SCADA',`${t.id}: ${f.alarm}${off?' (เรียกตัวนอกเวลางาน)':''}`,'bad');refreshTf(t);
}
function repairDone(t){
 t.status='done';t.crew.forEach(i=>{G.techs[i].busy=false;G.techs[i].job=null;});
 logEv(`${t.id} ช่างแจ้งซ่อมเสร็จ พร้อมจ่ายไฟ (${t.crew.map(i=>TECH_DEFS[i].name).join(', ')})`,'info',t.id);
 addMsg('ทีมช่าง',`${t.id} ซ่อมเสร็จแล้ว ปลดป้ายและสับจ่ายไฟได้`,'good');beep(2,660);refreshTf(t);refreshNPC();
}
function energize(t){
 const dur=G.h-t.failAt;t.downDone+=dur;t.repairs++;
 G.forms.push({id:G.formSeq++,tf:t.id,trueStart:t.failAt,trueEnd:G.h,trueCause:FK(t.fk).name,crew:t.crew.map(i=>TECH_DEFS[i].name),created:G.h,submitted:false,auto:false,rec:null,accurate:false,flag:false});
 logEv(`${t.id} ENERGIZED — กลับมาจ่ายไฟ`,'good',t.id);toast(`${t.id} กลับมาจ่ายไฟแล้ว · อย่าลืมเขียนใบ FM-OPR-06-01`,'good');
 const D=DIFFS[G.diff];Object.assign(t,{status:'ok',fk:null,crew:[],acked:true,diag:null,esc:false});t.nextFail=G.h+Math.max(6,expRand(defOf(t.id).mtbf*D.mtbf));
 refreshTf(t);
}
function collapse(){if(G.drive!=null){G.veh[G.drive].speed=0;placeVehicle(G.drive);G.drive=null;setRiderPose(false);}G.stats.collapse++;G.needs.energy=5;G.needs.stress=clamp(G.needs.stress+20,0,100);player.pos.set(HOME.ox+3.5,0,HOME.oz+3);player.yaw=Math.PI;G.sleeping={until:G.h+6};$('sleep').classList.remove('hidden');if(document.pointerLockElement)document.exitPointerLock();
 addMsg('หัวหน้า','ได้ข่าวว่าเป็นลมเพราะพักผ่อนไม่พอ ดูแลตัวเองด้วยนะ ไม่อย่างนั้นงานก็เสีย','bad');toast('หมดแรงจนหมดสติ… ถูกพาไปพักที่บ้านพัก 6 ชม.','bad');}

/* ================= PLAYER ACTIONS ================= */
function advance(hours){simulate(hours);}
function eat(kind){
 const o={cook:{price:60,food:60,dur:0.5,text:'ทำข้าวผัดกินเอง'},rest:{price:90,food:75,dur:0.33,text:'กินข้าวราดแกง'},fridge:{price:45,food:28,dur:0.1,text:'กินขนมกับนม'},mart:{price:35,food:25,dur:0.1,text:'กินขนมปังกับนมจากมินิมาร์ท'},coffee:{price:55,food:5,dur:0.15,text:'ดื่มกาแฟเย็น',energy:15,open:[7,19]}}[kind];
 if(kind==='rest')o.open=[6,20];const hr=G.h%24;if(o.open&&(hr<o.open[0]||hr>=o.open[1])){toast(`ร้านปิดแล้ว (เปิด ${o.open[0]}:00–${o.open[1]}:00)`,'bad');return;}
 if(G.wallet<o.price){toast('เงินในกระเป๋าไม่พอ','bad');return;}
 if(G.needs.food>92&&!o.energy){toast('ยังอิ่มอยู่');return;}
 G.wallet-=o.price;G.needs.food=clamp(G.needs.food+o.food,0,100);if(o.energy)G.needs.energy=clamp(G.needs.energy+o.energy,0,100);G.needs.stress=clamp(G.needs.stress-5,0,100);advance(o.dur);toast(`${o.text} (${baht(o.price)})`,'good');
}
function shower(){advance(0.25);G.needs.stress=clamp(G.needs.stress-18,0,100);G.needs.energy=clamp(G.needs.energy+5,0,100);toast('อาบน้ำสดชื่นขึ้น','good');}
function washFace(){advance(0.08);G.needs.energy=clamp(G.needs.energy+4,0,100);G.needs.stress=clamp(G.needs.stress-3,0,100);toast('ล้างหน้าให้ตื่นตัว','good');}
function relaxTV(){advance(0.5);G.needs.stress=clamp(G.needs.stress-15,0,100);toast('พักผ่อนดูทีวี ความเครียดลดลง','good');}
function punch(){
 const lp=G.punches[G.punches.length-1];
 if(lp&&lp.out===null){lp.out=G.h;toast(`ตอกบัตรออก ${clockS(G.h)}`,'good');logEv('ตอกบัตรออกงาน');}
 else{G.punches.push({in:G.h,out:null,auto:false});const d=Math.floor(G.h/24)+1,b=(d-1)*24,hd=G.h-b;
  toast(`ตอกบัตรเข้า ${clockS(G.h)}${isWork(d)&&hd>8+5/60&&hd<17?' (สาย)':''}${!isWork(d)||hd<8||hd>=17?' · นับเป็นเวลาล่วงเวลา':''}`,isWork(d)&&hd>8+5/60&&hd<17?'bad':'good');logEv('ตอกบัตรเข้างาน');}
 beep(1,1200);
}
function openSleep(){openModal('sleep',`<h2>นอนพัก</h2><p class="mut">${fmtT(G.h)} · พลังงาน ${Math.round(G.needs.energy)}%</p><p>ถ้ามีเหตุขัดข้อง โทรศัพท์จะปลุกอัตโนมัติ</p>
 <div class="btnrow" style="justify-content:flex-start"><button onclick="goSleep(1)">งีบ 1 ชม.</button><button onclick="goSleep(3)">3 ชม.</button><button onclick="goSleep(6)">6 ชม.</button><button class="gold" onclick="goSleep('morning')">ถึง 06:30</button><button class="ghost" onclick="closeModal()">ยกเลิก</button></div>`);}
function goSleep(x){let until;if(x==='morning'){const d=Math.floor(G.h/24);until=d*24+6.5;if(until<=G.h+0.5)until+=24;}else until=G.h+x;
 G.sleeping={until};closeModal();$('sleep').classList.remove('hidden');if(document.pointerLockElement)document.exitPointerLock();}

/* ---------- switching ---------- */
function switchErr(msg){G.stats.switchErr++;G.needs.stress=clamp(G.needs.stress+8,0,100);logEv('ความผิดพลาดในการสั่งการ: '+msg,'bad');toast('ผิดขั้นตอน: '+msg,'bad');beep(2,300);}
function op(id,act){
 const t=tfOf(id);
 if(G.needs.energy<25&&Math.random()<0.2){toast('ง่วงจนกดพลาด คำสั่งถูกยกเลิก ลองใหม่อีกครั้ง','bad');G.needs.stress=clamp(G.needs.stress+4,0,100);openScada();return;}
 const busy=t.status==='fault'||t.status==='repair';
 if(act==='ack'){t.acked=true;logEv(`${t.id} รับทราบ alarm`,'info',t.id);}
 else if(act==='open24'){if(t.status==='ok'){toast('หม้อแปลงทำงานปกติ ไม่มีใบสั่งงานให้ปลด','bad');}else{t.cb24=false;logEv(`${t.id} เปิด CB 24 kV`,'info',t.id);}}
 else if(act==='open115'){if(t.status==='ok'){toast('หม้อแปลงทำงานปกติ ไม่มีใบสั่งงานให้ปลด','bad');}else if(t.cb24)switchErr('ต้องเปิด CB 24 kV (ปลดโหลด) ก่อน CB 115 kV');else{t.cb115=false;logEv(`${t.id} เปิด CB 115 kV`,'info',t.id);}}
 else if(act==='tag'){if(t.cb115||t.cb24)switchErr('ต้องเปิดเบรกเกอร์ทั้งสองก่อนแขวนป้ายห้ามสับ');else{t.tag=true;logEv(`${t.id} แขวนป้ายห้ามสับ`,'info',t.id);}}
 else if(act==='untag'){if(t.status==='repair')switchErr('ห้ามปลดป้ายระหว่างช่างกำลังทำงาน');else{t.tag=false;logEv(`${t.id} ปลดป้ายห้ามสับ`,'info',t.id);}}
 else if(act==='close115'){if(t.tag)switchErr('ยังแขวนป้ายห้ามสับอยู่');else if(busy)switchErr('ยังซ่อมไม่เสร็จ ห้ามจ่ายไฟเข้าหม้อแปลง');else{t.cb115=true;logEv(`${t.id} สับ CB 115 kV`,'info',t.id);}}
 else if(act==='close24'){if(t.tag)switchErr('ยังแขวนป้ายห้ามสับอยู่');else if(busy)switchErr('ยังซ่อมไม่เสร็จ ห้ามจ่ายไฟ');else if(!t.cb115)switchErr('ต้องสับ CB 115 kV ก่อน CB 24 kV');else{t.cb24=true;logEv(`${t.id} สับ CB 24 kV`,'info',t.id);if(t.status==='done')energize(t);}}
 refreshTf(t);openScada();
}
function nextStep(t){
 if(t.status==='fault'){if(!t.acked)return 'รับทราบ alarm ที่จอ SCADA';if(!t.diag)return 'ไปตรวจหน้างานและวินิจฉัยสาเหตุ';if(t.cb24)return 'เปิด CB 24 kV';if(t.cb115)return 'เปิด CB 115 kV';if(!t.tag)return 'แขวนป้ายห้ามสับ';return 'สั่งทีมช่างเข้าซ่อม';}
 if(t.status==='repair')return `ช่างกำลังซ่อม · เสร็จประมาณ ${fmtS(t.repairEnd)}`;
 if(t.status==='done'){if(t.tag)return 'ปลดป้ายห้ามสับ';if(!t.cb115)return 'สับ CB 115 kV';return 'สับ CB 24 kV เพื่อจ่ายไฟ';}
 return '';
}

function dispatch(id){
 const t=tfOf(id),f=FK(t.fk),diag=FK(t.diag);const crew=[...document.querySelectorAll('input[name=cr]:checked')].map(x=>+x.value);
 if(!crew.length){$('dpErr').textContent='เลือกช่างอย่างน้อย 1 คน';return;}
 const wrong=diag!==f;let cost=0,lead=0;
 if(G.stock[f.part]>0)G.stock[f.part]--;else{cost+=PARTS[f.part].price*1.5;lead=LEAD;}
 const skillOk=crew.some(i=>f.skill.includes(TECH_DEFS[i].skill));const avgF=crew.reduce((a,i)=>a+G.techs[i].fatigue,0)/crew.length;
 let work=f.base*rand(0.85,1.2)*(skillOk?0.85:1.2)*(crew.length>1?1:1.5)*(wrong?1.6:1)*(t.esc?1.3:1);
 let rework=false;if(avgF>70){work*=1.3;if(Math.random()<0.2){work*=1.4;rework=true;}}
 cost+=work*crew.length*1500+(wrong?30000:0);
 t.status='repair';t.repairStart=G.h+0.5;t.repairEnd=t.repairStart+work+lead;t.crew=crew;t.wrong=wrong;
 crew.forEach(i=>{G.techs[i].busy=true;G.techs[i].job=id;});G.budget-=cost;
 logEv(`${id} สั่งงานซ่อม: ${crew.map(i=>TECH_DEFS[i].name).join(', ')} (วินิจฉัย: ${diag.name})`,'info',id);
 toast(`สั่งงานแล้ว · ค่าใช้จ่าย ${baht(cost)}${lead?' · รออะไหล่ '+LEAD+' ชม.':''}`,lead?'bad':'good');
 if(wrong)setTimeout(()=>addMsg('ทีมช่าง',`${id} สาเหตุไม่ตรงกับที่วินิจฉัย ต้องตรวจซ้ำ เวลาซ่อมจะนานขึ้น`,'bad'),2500);
 if(rework)setTimeout(()=>addMsg('ทีมช่าง',`${id} ช่างเหนื่อยมาก งานบางส่วนต้องทำใหม่`,'bad'),5000);
 refreshTf(t);refreshNPC();closeModal();
}

function submitForm(id){
 const f=G.forms.find(x=>x.id===id),e=$('fErr');const tf=$('fTf').value,ty=(document.querySelector('input[name=fTy]:checked')||{}).value,sd=+$('fSd').value,ed=+$('fEd').value,st=$('fSt').value,et=$('fEt').value,cs=$('fCs').value;
 if(!tf||!ty||!st||!et||!cs){e.textContent='กรอกให้ครบทุกช่องที่จำเป็น';return;}
 if(!$('fOk').checked){e.textContent='ต้องติ๊กรับรองข้อมูลก่อนลงชื่อ';return;}
 const toH=(d,t)=>{const [hh,mm]=t.split(':').map(Number);return (d-1)*24+hh+mm/60;};const s=toH(sd,st),en=toH(ed,et);
 if(en<s){e.textContent='เวลาแก้ไขเสร็จต้องไม่อยู่ก่อนเวลาเกิดเหตุ';return;}
 if(en>G.h+0.02){e.textContent='เวลาแก้ไขเสร็จยังมาไม่ถึง';return;}
 f.rec={tf,type:ty,start:s,end:en,cause:cs,act:$('fAct').value};f.submitted=true;f.flag=Math.abs(en-s)<0.01;
 f.accurate=tf===f.tf&&ty==='CM'&&Math.abs(s-f.trueStart)<=0.25&&Math.abs(en-f.trueEnd)<=0.25&&cs===f.trueCause;
 advance(0.25);logEv(`ส่งใบ FM-OPR-06-01 #${f.id}`);toast(f.accurate?`ใบ #${f.id} ข้อมูลถูกต้อง`:`ใบ #${f.id} ข้อมูลไม่ตรงกับเหตุการณ์จริง`,f.accurate?'good':'bad');formSel=null;openFormDesk();
}

/* ---------- save / load ---------- */
function hasSave(){try{return !!localStorage.getItem(SKEY);}catch(e){return false;}}
function saveGame(manual){if(!G||state!=='play')return;G.pos=[player.pos.x,player.pos.z];G.yaw=player.yaw;try{localStorage.setItem(SKEY,JSON.stringify(G));if(manual)toast('เซฟเกมแล้ว','good');}catch(e){if(manual)toast('เซฟไม่สำเร็จ (เบราว์เซอร์ไม่อนุญาตพื้นที่เก็บข้อมูล)','bad');}}
function loadGame(){let s=null;try{s=JSON.parse(localStorage.getItem(SKEY));}catch(e){}if(!s||s.v!==3){toast('ไม่พบเซฟ','bad');return;}
 G=s;gender=G.gender;player.pos.set(G.pos[0],0,G.pos[1]);player.yaw=G.yaw;player.pitch=0;
 if(playerChar)scene.remove(playerChar.grp);playerChar=makeCharacter(gender);scene.add(playerChar.grp);fpHandM.color.set(gender==='f'?0xf0b49a:0xc98a64);attachHeld(playerChar);
 G.tf.forEach(refreshTf);refreshNPC();G.veh.forEach((v,i)=>placeVehicle(i));setRiderPose(G.drive!=null&&G.veh[G.drive].type==='bike');buildHotbar();syncSpeed();if(G.sleeping)$('sleep').classList.remove('hidden');else $('sleep').classList.add('hidden');
 if(state!=='play'){$('select').classList.add('hidden');$('hud').classList.remove('hidden');if(isTouch){$('joy').classList.remove('hidden');$('mbtns').classList.remove('hidden');}state='play';}
 uiOpen=false;uiKind=null;$('modal').classList.add('hidden');toast('โหลดเกมแล้ว','good');}

function refreshTf(t){
 const v=vOf(t.id);const col=t.status==='ok'?'#97c459':t.status==='fault'?'#e24b4a':t.status==='repair'?'#fac775':'#85b7eb';

 drawLabel(v.label,t.id,sub,col);
 v.lampM.color.set(t.status==='ok'?0x2a8a3a:t.status==='fault'?0x8a1a1a:t.status==='repair'?0x8a6a10:0x1a4a8a);
 v.lampM.emissive.set(t.status==='ok'?0x39d353:t.status==='fault'?0xff2a2a:t.status==='repair'?0xffb020:0x3a8aff);

function refreshNPC(){
 const idle={KO:0,PR:0};
 G.techs.forEach((s,i)=>{const c=techChars[i],d=TECH_DEFS[i];
  if(s.busy&&s.job){const v=vOf(s.job),t=tfOf(s.job);const k=t.crew.indexOf(i);c.grp.position.set(v.cx-1.5+k*2.2,0,v.cz+3.9);c.grp.rotation.y=Math.PI;c.work=true;}
  else{const o=CB_OFF[d.home];const k=idle[d.home]++;c.grp.position.set(o.ox+19+k*1.6,0,o.oz+16.5);c.grp.rotation.y=k?-0.5:0.5;c.work=false;}});
 ['KO','PR'].forEach(code=>{const job=G.tf.find(t=>t.status==='repair'&&defOf(t.id).st===code);if(job){const v=vOf(job.id);const tr=trucks[code];tr.g.position.set(v.cx-5.2,0,v.cz+9);tr.g.rotation.y=Math.PI/2;tr.atJob=job.id;}else parkTruck(code);});
}

function endGame(){
 if(state==='end')return;state='end';G.h=MONTH_H;if(document.pointerLockElement)document.exitPointerLock();G.sleeping=null;$('sleep').classList.add('hidden');
 G.forms.forEach(f=>{if(!f.submitted){f.submitted=true;f.auto=true;f.rec={tf:f.tf,type:'CM',start:f.trueEnd,end:f.trueEnd,cause:'ไม่ระบุ'};f.flag=true;}});
 const rows=G.tf.map(t=>({t,s:stats(t),r:recStats(t)}));const pass=rows.filter(x=>x.s.A>=A_TARGET).length;
 const acc=G.forms.length?G.forms.filter(f=>f.accurate).length/G.forms.length:1;const {tot}=timecard();const p=payslip();G.wallet+=p.net;
 const sc={a:pass/6*40,f:acc*25,s:Math.max(0,15-G.stats.switchErr*5),t:Math.max(0,10-tot.late*2-tot.absent*5),w:Math.max(0,10-G.stats.collapse*5)};
 const score=sc.a+sc.f+sc.s+sc.t+sc.w;const grade=score>=90?'A':score>=78?'B':score>=62?'C':'D';const gap=rows.reduce((a,x)=>a+Math.abs(x.r.A-x.s.A),0)/6;
 try{localStorage.removeItem(SKEY);}catch(e){}
 uiOpen=true;uiKind='end';$('modal').classList.remove('hidden');
 $('mbox').innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="grade">${grade}</div><div><h2>RAM Shift · ผลประเมินประจำเดือนมิถุนายน 2569</h2><p class="mut">${G.name||'วิศวกร'} · ${G.gender==='f'?'วิศวกรหญิง':'วิศวกรชาย'} · ความยาก${DIFFS[G.diff].name} · คะแนน ${score.toFixed(0)}/100</p></div></div>
 <h3>Availability รายลูก (เป้า ≥ 96%) · ${sc.a.toFixed(0)}/40</h3><div class="tw"><table><tr><th>หม้อแปลง</th><th>เสีย</th><th>MTBF</th><th>MTTR</th><th>A จริง</th><th>A ตามใบบันทึก</th><th>ผล</th></tr>
 ${rows.map(x=>`<tr><td>${x.t.id}</td><td>${x.s.n}</td><td>${x.s.mtbf?x.s.mtbf.toFixed(0):'—'}</td><td>${x.s.mttr?x.s.mttr.toFixed(1):'—'}</td><td>${pct(x.s.A)}</td><td>${pct(x.r.A)}</td><td class="${x.s.A>=A_TARGET?'ok':'bad'}">${x.s.A>=A_TARGET?'ผ่าน':'ไม่ผ่าน'}</td></tr>`).join('')}</table></div>
 <h3>คุณภาพข้อมูล · ${sc.f.toFixed(0)}/25</h3><p>ใบ FM-OPR-06-01 ถูกต้อง ${G.forms.filter(f=>f.accurate).length} จาก ${G.forms.length} ใบ · ค่า A ที่รายงานต่างจากค่าจริงเฉลี่ย ${(gap*100).toFixed(2)} จุด</p>
 <h3>ความปลอดภัยในการสั่งการ · ${sc.s}/15</h3><p>ผิดขั้นตอน ${G.stats.switchErr} ครั้ง</p>
 <h3>ผลกระทบต่อโรงงาน</h3><p>ไฟฟ้าที่จ่ายไม่ได้รวม <b>${FACT.reduce((a,f)=>a+G.fact[f.id].ens,0).toFixed(1)} MWh</b> · โรงงานโทรร้องเรียน ${G.stats.complaints||0} ครั้ง</p><div class="tw"><table><tr><th>โรงงาน</th><th>รับไฟจาก</th><th>ไฟฟ้าที่ขาด (MWh)</th></tr>${FACT.map(f=>`<tr><td>บจก. ${f.name}</td><td>${f.tf}</td><td>${G.fact[f.id].ens.toFixed(1)}</td></tr>`).join('')}</table></div>
 <h3>การมาทำงาน · ${sc.t}/10</h3><p>สาย ${tot.late} · ขาด ${tot.absent} · ล่วงเวลา ${tot.ot.toFixed(1)} ชม.</p>
 <h3>สุขภาพ · ${sc.w}/10</h3><p>หมดสติ ${G.stats.collapse} ครั้ง</p>
 <h3>สลิปเงินเดือน</h3>${slipTable(p)}<p style="margin-top:8px">เงินในบัญชีสิ้นเดือน <b>${baht(G.wallet)}</b> · งบซ่อมบำรุงคงเหลือ <b class="${G.budget>=0?'ok':'bad'}">${baht(G.budget)}</b></p>
 <p class="mut" style="margin-top:8px">“${pass===6&&acc>=0.8?'เดือนนี้ทำได้ดีมาก ข้อมูลครบถ้วน เอาไปวิเคราะห์ R/A/M ต่อได้เลย':acc<0.8?'ถ้าใบบันทึกไม่ครบ ค่า R/A/M ที่รายงานจะดูดีกว่าความจริง ต้องบันทึกให้ถูกทุกครั้ง':'หม้อแปลงบางลูกหยุดนานเกินไป ลองตอบสนองให้เร็วขึ้นและเตรียมอะไหล่ล่วงหน้า'}” — คุณประเสริฐ</p>
 <div class="btnrow"><button class="gold" onclick="location.reload()">เล่นเดือนใหม่</button></div>`;
}

const keys={};
addEventListener('keydown',e=>{
 const tag=(e.target.tagName||'').toLowerCase();
 if(state!=='play')return;
 if(e.key==='Escape'){if(uiOpen&&uiKind!=='brief')closeModal();else if(!uiOpen&&!G.sleeping)openSettings();return;}
 if(tag==='input'||tag==='select'||tag==='textarea')return;
 if(e.key==='Tab'){e.preventDefault();if(uiKind==='phone')closeModal();else if(!uiOpen&&!G.sleeping)openPhone();return;}
 keys[e.code]=true;
 if(uiOpen||G.sleeping)return;
 if(e.code==='KeyE')doInteract();
 if(e.code==='KeyV'){S.third=!S.third;saveSettings();camInit=false;}
 if(e.code==='KeyF')toggleVehicle();
 if(e.code==='KeyP')setSpeed(S.speed===0?1:0);
 if(/^Digit[1-6]$/.test(e.code))selectItem(ITEMS[+e.code.slice(5)-1].k);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
canvas.addEventListener('click',()=>{if(state==='play'&&!uiOpen&&!isTouch&&!document.pointerLockElement&&!G.sleeping)canvas.requestPointerLock();});
addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&!uiOpen){if(G&&G.drive!=null)drvLook=clamp(drvLook-e.movementX*0.0022*S.sens,-1.8,1.8);else player.yaw-=e.movementX*0.0022*S.sens;player.pitch=clamp(player.pitch-e.movementY*0.0022*S.sens*(S.invert?-1:1),-1.3,1.2);}});
let joyV={x:0,y:0},joyId=null,lookId=null,lookLast=null;const joy=$('joy'),knob=$('knob');
joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;moveJoy(t);},{passive:false});
function moveJoy(t){const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60);const d=Math.hypot(dx,dy);if(d>50){dx*=50/d;dy*=50/d;}knob.style.left=(35+dx)+'px';knob.style.top=(35+dy)+'px';joyV={x:dx/50,y:dy/50};}
addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joyId)moveJoy(t);else if(t.identifier===lookId&&!uiOpen){if(G&&G.drive!=null)drvLook=clamp(drvLook-(t.clientX-lookLast.x)*0.006*S.sens,-1.8,1.8);else player.yaw-=(t.clientX-lookLast.x)*0.006*S.sens;player.pitch=clamp(player.pitch-(t.clientY-lookLast.y)*0.006*S.sens*(S.invert?-1:1),-1.3,1.2);lookLast={x:t.clientX,y:t.clientY};}}},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===joyId){joyId=null;joyV={x:0,y:0};knob.style.left='35px';knob.style.top='35px';}if(t.identifier===lookId)lookId=null;}});
canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX>innerWidth*0.35&&lookId===null){lookId=t.identifier;lookLast={x:t.clientX,y:t.clientY};}}},{passive:true});
$('bE').onclick=()=>{if(!uiOpen&&!G.sleeping)doInteract();};$('bTab').onclick=()=>{if(!uiOpen&&!G.sleeping)openPhone();};$('bPhone').onclick=()=>{if(!G.sleeping)openPhone();};
$('bV').onclick=()=>{S.third=!S.third;saveSettings();camInit=false;};$('bF').onclick=()=>{if(!uiOpen&&!G.sleeping)toggleVehicle();};$('bItem').onclick=()=>{const i=ITEMS.findIndex(x=>x.k===G.held);selectItem(ITEMS[(i+1)%ITEMS.length].k);};

function nearestTfId(){let best=null,bd=1e9;for(const v of tfv){const nx=clamp(player.pos.x,v.cx-3.75,v.cx+3.75),nz=clamp(player.pos.z,v.cz-2.75,v.cz+2.75);const d=Math.hypot(player.pos.x-nx,player.pos.z-nz);if(d<bd){bd=d;best=v.id;}}return bd<2.4?best:null;}
function nearestInteract(){const tid=nearestTfId();if(tid)return {label:'ตรวจหม้อแปลง '+tid,fn:()=>openInspect(tid)};
 let best=null,bd=1e9;for(const it of interacts){const d=Math.hypot(player.pos.x-it.x,player.pos.z-it.z);if(d<it.r&&d<bd){bd=d;best=it;}}return best;}
function doInteract(){if(G.drive!=null)return;const it=nearestInteract();if(it)it.fn();else if(isTouch)toast('ไม่มีอะไรให้ใช้ตรงนี้');}
function locName(){const p=player.pos;const r=ROOMS.find(r=>p.x>=r.x1&&p.x<=r.x2&&p.z>=r.z1&&p.z<=r.z2);if(r)return r.name;const inZ=z=>p.x>=z.x1&&p.x<=z.x2&&p.z>=z.z1&&p.z<=z.z2;const z=FZONES.find(inZ)||ZONES.find(inZ);return z?z.name:'นิคมอุตสาหกรรมบางปู';}
function indoors(){const p=player.pos;return IND.some(b=>p.x>b.x1&&p.x<b.x2&&p.z>b.z1&&p.z<b.z2);}
function collide(q,r=0.3){let hit=0;const LS=DYN.length?colliders.concat(DYN):colliders;for(const b of LS){const nx=clamp(q.x,b.x1,b.x2),nz=clamp(q.z,b.z1,b.z2);const dx=q.x-nx,dz=q.z-nz,d2=dx*dx+dz*dz;
 if(d2<r*r){hit=1;if(d2>1e-8){const d=Math.sqrt(d2);q.x=nx+dx/d*r;q.z=nz+dz/d*r;}else{const l=q.x-b.x1,R=b.x2-q.x,t=q.z-b.z1,B=b.z2-q.z,m=Math.min(l,R,t,B);if(m===l)q.x=b.x1-r;else if(m===R)q.x=b.x2+r;else if(m===t)q.z=b.z1-r;else q.z=b.z2+r;}}}return hit;}

/* ---------- select screen ---------- */
function pickGender(g){gender=g;$('pickF').classList.toggle('on',g==='f');$('pickM').classList.toggle('on',g==='m');}
$('pickF').onclick=()=>pickGender('f');$('pickM').onclick=()=>pickGender('m');
if(hasSave())$('contBtn').classList.remove('hidden');
$('contBtn').onclick=()=>{initAudio();loadGame();};
$('startBtn').onclick=()=>{
 G=newState($('selName').value.trim(),gender,$('selDiff').value);
 initAudio();playerChar=makeCharacter(gender);scene.add(playerChar.grp);fpHandM.color.set(gender==='f'?0xf0b49a:0xc98a64);attachHeld(playerChar);
 player.pos.set(HOME.ox+3.5,0,HOME.oz+3);player.yaw=Math.PI;
 G.tf.forEach(refreshTf);refreshNPC();G.veh.forEach((v,i)=>placeVehicle(i));buildHotbar();syncSpeed();
 $('select').classList.add('hidden');$('hud').classList.remove('hidden');if(isTouch){$('joy').classList.remove('hidden');$('mbtns').classList.remove('hidden');}
 state='play';
 G.msgs.push({t:G.h,from:'หัวหน้า',text:'ยินดีต้อนรับ เริ่มงานวันจันทร์ 08:00 อย่าลืมตอกบัตรที่อาคารควบคุมนะ'});G.unread=1;
 openModal('brief',`<h2>สวัสดี${G.name?' '+G.name:''} — วิศวกรประจำสถานีคนใหม่</h2>
 <p>เดือนมิถุนายน 2569 คุณดูแลหม้อแปลง 6 ลูก ที่<b>สถานีคอต่อ (KO)</b> และ<b>สถานีแพรกษา (PR)</b> เวลาในเกม 1 ชม. = 1 นาทีจริง (ปรับได้ในตั้งค่า)</p>
 <h3>ชีวิตประจำวัน</h3><ul><li>ทำงานวันจันทร์–ศุกร์ 08:00–17:00 ตอกบัตรเข้า-ออกที่โถงอาคารควบคุม นอกเวลาถูกเรียกเวรได้ ได้ค่าล่วงเวลา</li><li>ต้องกิน นอน และคลายเครียด — ถ้าหิวหรือง่วงมาก จะเดินช้า ตัดสินใจพลาดง่าย และอาจหมดสติ</li><li>เงินเดือน ${baht(BASE_SALARY)} จ่ายวันที่ 15 ครึ่งหนึ่ง ส่วนที่เหลือจ่ายสิ้นเดือน ตามบัตรตอกเวลา</li><li>มอเตอร์ไซค์จอดหน้าบ้านพัก รถกระบะสถานีจอดที่ KO — กด F เพื่อขึ้น/ลง (สถานีห่างกันราว 1.1 กม.)</li><li>ของในมือมีผลจริง: ปากกาเขียนใบบันทึก · IR วัดอุณหภูมิถัง · แคลมป์มิเตอร์วัดแรงดัน · วิทยุสั่งช่างจากหน้างาน · ไฟฉายตอนกลางคืน</li></ul>
 <h3>เมื่อเกิดเหตุขัดข้อง</h3><ul><li>รับทราบ alarm ที่จอ SCADA ห้องควบคุม</li><li>เดินไปตรวจหน้างานแล้ววินิจฉัย</li><li>กลับมาเปิด CB 24 kV → CB 115 kV → แขวนป้ายห้ามสับ แล้วสั่งทีมช่าง</li><li>ซ่อมเสร็จ: ปลดป้าย → สับ CB 115 kV → สับ CB 24 kV เพื่อจ่ายไฟ</li><li>เขียนใบ FM-OPR-06-01 ที่โต๊ะในห้องควบคุมภายใน 3 วัน</li><li>โรงงาน 8 แห่งในนิคมรับไฟจากหม้อแปลง ถ้าหยุดจ่ายไฟ โรงงานจะดับและโทรร้องเรียน</li></ul>
 <h3>เป้าหมาย</h3><p>Availability ทุกลูก ≥ 96% · ใบบันทึกถูกต้อง · ไม่ผิดขั้นตอนความปลอดภัย · มาทำงานตรงเวลา · ดูแลสุขภาพ</p>
 <h3>การควบคุม</h3><p>${isTouch?'จอยซ้ายเดิน/ขับ · ลากจอขวาหันมอง · ปุ่ม ใช้/ตรวจ, โทรศัพท์, มุมมอง, ขึ้น/ลงรถ, เปลี่ยนของในมือ':'WASD เดิน/ขับ · Shift วิ่ง · Space เบรก · คลิกจอเพื่อใช้เมาส์ · E ใช้/ตรวจ · F ขึ้น/ลงรถ · 1–6 ของในมือ · Tab โทรศัพท์ · V มุมมอง · P หยุดเวลา · Esc ตั้งค่า'}</p>
 <div class="btnrow"><button class="gold" onclick="beginGame()">เริ่มวันแรก</button></div>`);
};
function beginGame(){uiOpen=false;uiKind=null;$('modal').classList.add('hidden');if(!isTouch)canvas.requestPointerLock();}

/* ================= HUD ================= */
function needBar(lbl,v,inv){const c=inv?(v>70?'#e24b4a':v>45?'#ef9f27':'#97c459'):(v<20?'#e24b4a':v<45?'#ef9f27':'#97c459');return `<div class="nrow"><span>${lbl}</span><div class="bar"><i style="width:${v}%;background:${c}"></i></div><span style="width:34px;text-align:right">${Math.round(v)}</span></div>`;}
function updateHUD(){
 $('hDate').textContent=fmtT(G.h);$('hLoc').textContent=locName();
 const lp=G.punches[G.punches.length-1],inw=lp&&lp.out===null;$('hClock').className='chip '+(inw?'in':'out');$('hClock').textContent=inw?`เข้างานแล้ว ${clockS(lp.in)}`:'ยังไม่ได้ตอกบัตร';
 $('needs').innerHTML=needBar('อิ่ม',G.needs.food)+needBar('พลังงาน',G.needs.energy)+needBar('เครียด',G.needs.stress,true)+`<div class="nrow"><span>เงิน</span><b>${baht(G.wallet)}</b></div>`;
 $('info').innerHTML=`งบซ่อม ${baht(G.budget)}<br>ช่างว่าง ${G.techs.filter(t=>!t.busy).length}/4 · ใบงานค้าง ${G.forms.filter(f=>!f.submitted).length}`;
 $('badge').textContent=G.unread;$('badge').classList.toggle('hidden',!G.unread);
 $('avail').innerHTML='<b>Availability เดือนนี้ (เป้า 96%)</b>'+G.tf.map(t=>{const a=stats(t).A;const c=a>=0.98?'#97c459':a>=A_TARGET?'#ef9f27':'#e24b4a';const w=clamp((a-0.85)/0.15,0,1);const dot=t.status==='ok'?'':` <span style="color:${t.status==='fault'?'#f09595':t.status==='repair'?'#fac775':'#85b7eb'}">●</span>`;
  return `<div class="nrow"><span style="width:30px">${t.id}</span><div class="bar"><i style="width:${w*100}%;background:${c}"></i></div><span style="width:50px;text-align:right">${(a*100).toFixed(1)}%</span>${dot}</div>`;}).join('');
 const pend=G.tf.filter(t=>t.status==='fault'||t.status==='done');
 if(pend.length){$('alert').classList.remove('hidden');$('alert').innerHTML=pend.map(t=>`${t.id}: ${nextStep(t)}`).join('<br>');}else $('alert').classList.add('hidden');
 $('vig').style.opacity=G.needs.energy<25?(0.35+(25-G.needs.energy)/40):0;
 if(G.sleeping)$('sleepT').textContent=`${fmtT(G.h)} · ตื่น ${clockS(G.sleeping.until)} · พลังงาน ${Math.round(G.needs.energy)}%`;
}

/* ================= LOOP ================= */
const clock=new THREE.Clock();let blink=0,hudT=0,scT=0,lastSave=0;
function tick(){
 requestAnimationFrame(tick);
 const dt=Math.min(clock.getDelta(),0.1);blink+=dt;
 if(state==='select'){selF.grp.rotation.y+=dt*(gender==='f'?1.2:0.25);selMch.grp.rotation.y+=dt*(gender==='m'?1.2:0.25);rings.f.visible=gender==='f';rings.m.visible=gender==='m';renderer.render(selScene,selCam);return;}
 const paused=uiOpen&&S.pauseUI&&!G.sleeping;
 if(state==='play'&&!paused){const rate=G.sleeping?1:(S.speed/60)*(G.drive!=null?0.25:1);if(rate>0)simulate(dt*rate);}
 if(state==='play'&&G.h-lastSave>=1){lastSave=G.h;saveGame(false);}
 // movement
 const p=player;let moving=false;
 if(state==='play'&&!uiOpen&&!G.sleeping&&G.drive!=null)driveUpdate(dt);
 else if(state==='play'&&!uiOpen&&!G.sleeping){
  let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA||keys.ArrowLeft)s-=1;if(keys.KeyD||keys.ArrowRight)s+=1;f-=joyV.y;s+=joyV.x;
  const len=Math.hypot(f,s);if(len>0.05){moving=true;let sp=(keys.ShiftLeft||keys.ShiftRight||(isTouch&&len>0.95)?6:3.4)*Math.min(1,len);if(G.needs.food<20||G.needs.energy<20)sp*=0.65;f/=Math.max(1,len);s/=Math.max(1,len);
   const fx=-Math.sin(p.yaw),fz=-Math.cos(p.yaw);p.pos.x+=(fx*f-fz*s)*sp*dt;p.pos.z+=(fz*f+fx*s)*sp*dt;collide(p.pos);p.pos.x=clamp(p.pos.x,-640,640);p.pos.z=clamp(p.pos.z,-280,320);p.walkT+=dt*sp*2.2;}}
 updatePlayerChar(moving);
 const ind=indoors();
 if(state==='end'){const a=blink*0.25;camera.position.set(p.pos.x+Math.sin(a)*4,2.4,p.pos.z+Math.cos(a)*4);camera.lookAt(p.pos.x,1.3,p.pos.z);}
 else if(G.drive!=null)driveCamera(dt);
 else if(S.third){const fx=-Math.sin(p.yaw),fz=-Math.cos(p.yaw);const dd=ind?2.0:4.2;camera.position.set(p.pos.x-fx*dd,2.2-p.pitch*1.2*(ind?0.4:1),p.pos.z-fz*dd);camera.rotation.set(p.pitch*0.6-0.2,p.yaw,0);}
 else{camera.position.set(p.pos.x,1.65,p.pos.z);camera.rotation.set(p.pitch,p.yaw,0);}
 // doors
 doors.forEach(d=>{const near=Math.hypot(p.pos.x-d.cx,p.pos.z-d.cz)<2.2;d.open+=((near?1:0)-d.open)*Math.min(1,dt*6);d.pivot.rotation.y=-d.open*1.45;});
 // day/night
 const hd=G.h%24,sunUp=Math.max(0,Math.sin((hd-6)/12*Math.PI));
 const sky=skyNight.clone().lerp(skyDay,Math.min(1,sunUp*2.2));if(sunUp>0&&sunUp<0.35)sky.lerp(skyDusk,(0.35-sunUp)*1.2);scene.background.copy(sky);scene.fog.color.copy(sky);
 sun.intensity=0.12+0.95*sunUp;hemi.intensity=0.32+0.4*sunUp+(ind?0.45:0);
 const ang=(hd-6)/12*Math.PI;sun.position.set(p.pos.x+Math.cos(ang)*90,20+Math.max(0,Math.sin(ang))*90,p.pos.z+40);sun.target.position.set(p.pos.x,0,p.pos.z);
 lamps.forEach(l=>l.material.emissiveIntensity=sunUp<0.15?1.5:0);
 // transformer fx
 if(G)for(const t of G.tf){const v=vOf(t.id);
  if(t.status==='fault')v.lampM.emissiveIntensity=(Math.sin(blink*8)>0)?1.6:0.15;else v.lampM.emissiveIntensity=1;
  if(energized(t)&&t.fk!=='fan')v.fans.forEach(f=>f.rotation.x+=dt*14);
  if(t.status!=='ok'&&FK(t.fk).smoke&&(t.status==='fault'||G.h<t.repairStart+2)){v.smokeT+=dt;if(v.smokeT>0.2){v.smokeT=0;spawnPuff(v);}}}
 for(let i=puffs.length-1;i>=0;i--){const q=puffs[i];q.life+=dt;q.sp.position.y+=dt*1.3;q.sp.position.x+=dt*0.4;const sc=(1+q.life*1.2)*(q.s||1);q.sp.scale.set(sc,sc,1);q.sp.material.opacity=Math.max(0,0.8-q.life*0.27);if(q.life>3){scene.remove(q.sp);q.sp.material.dispose();puffs.splice(i,1);}}
 ['KO','PR'].forEach(c=>{const tr=trucks[c];tr.bm.emissiveIntensity=tr.atJob&&Math.sin(blink*10)>0?2:0;});
 techChars.forEach(c=>{if(c.work){c.armR.rotation.x=-1.2+Math.sin(blink*6)*0.4;c.armL.rotation.x=-0.6;}else{c.armR.rotation.x=0;c.armL.rotation.x=0;}});
 if(G)worldUpdate(dt,paused,sunUp);
 // prompt
 if(state==='play'&&!uiOpen&&!G.sleeping){const nv=G.drive==null?nearestVehicle():-1;const it=G.drive!=null?null:(nearestInteract()||(nv>=0?{label:G.veh[nv].type==='bike'?'ขี่มอเตอร์ไซค์':'ขับรถกระบะสถานี',key:'F'}:null));if(it){$('prompt').classList.remove('hidden');$('prompt').innerHTML=`<b>${isTouch?(it.key==='F'?'ขึ้น/ลงรถ':'ใช้'):(it.key||'E')}</b>${it.label}`;}else $('prompt').classList.add('hidden');}else $('prompt').classList.add('hidden');
 hudT+=dt;if(hudT>0.25&&G){hudT=0;updateHUD();}
 scT+=dt;if(scT>1){scT=0;drawScada();}
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitSelCam();});
function redrawSigns(){signs.forEach(o=>{const x=o.userData.c.getContext('2d');x.clearRect(0,0,o.userData.c.width,o.userData.c.height);o.userData.draw(x,o.userData.c.width,o.userData.c.height);o.userData.t.needsUpdate=true;});
 techChars.forEach((c,i)=>{const l=c.grp.children.find(o=>o.isSprite);if(l)drawLabel(l,TECH_DEFS[i].name,'ช่าง'+TECH_DEFS[i].skill,'#85b7eb');});drawLabel(chief.label,'คุณประเสริฐ','หัวหน้าสถานี','#fac775');if(G)G.tf.forEach(refreshTf);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawSigns);
addEventListener('beforeunload',()=>saveGame(false));
applyGfx();renderer.setSize(innerWidth,innerHeight);drawScada();
tick();
</script>
