<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAM Insight — Substation Engineer</title>
<meta name="description" content="เกมจำลองชีวิตวิศวกรดูแลหม้อแปลงไฟฟ้า สถานีคอต่อ (KO) และแพรกษา (PR) — Reliability / Availability / Maintainability">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06121f;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#e6f1fb;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.panel{background:rgba(4,44,83,.88);border:1px solid rgba(133,183,235,.25);border-radius:10px}
button{font-family:inherit;cursor:pointer;border:1px solid rgba(133,183,235,.45);background:#185fa5;color:#e6f1fb;border-radius:8px;padding:8px 14px;font-size:14px}
button:hover{background:#2470bb}
button.gold,button.on{background:#fac775;color:#633806;border-color:#fac775;font-weight:700}
button.gold:hover{background:#ffd78f}
button.red{background:#a32d2d;border-color:#e24b4a}
button.green{background:#3b6d11;border-color:#639922}
button.ghost{background:transparent}
button.sm{padding:4px 9px;font-size:12px}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border-radius:7px;border:1px solid rgba(133,183,235,.45);background:#0c2a4a;color:#e6f1fb}
input[type=range]{padding:0}
/* select */
#select{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 14px;pointer-events:none}
#select>*{pointer-events:auto}
#select h1{font-size:26px;font-weight:700;text-align:center}
#select .sub{color:#85b7eb;font-size:13px;text-align:center;margin-top:4px}
#selBottom{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:520px}
.row2{display:flex;gap:10px;width:100%}.row2>*{flex:1}
#selName{width:100%;text-align:center}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .panel{position:absolute;padding:8px 12px;pointer-events:auto}
#tl{top:10px;left:10px;min-width:230px}
#tl .big{font-size:16px;font-weight:700}
.small{font-size:12px;color:#85b7eb}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-top:4px}
.chip.in{background:#3b6d11;color:#eaf3de}.chip.out{background:#5f5e5a;color:#f1efe8}
#needs{top:86px;left:10px;width:230px;font-size:12px}
.nrow{display:flex;align-items:center;gap:6px;margin-top:3px}
.nrow span:first-child{width:52px}
.bar{flex:1;height:8px;border-radius:4px;background:#0c2a4a;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
#tr{top:10px;right:10px;display:flex;gap:6px;padding:6px!important}
#tr button{padding:6px 12px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:#e24b4a;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
#info{top:60px;right:10px;text-align:right;font-size:12px;min-width:200px}
#alert{top:10px;left:50%;transform:translateX(-50%);background:#a32d2d!important;border-color:#e24b4a!important;max-width:42vw;text-align:center;font-size:13px;font-weight:500}
#avail{left:10px;bottom:10px;width:230px;font-size:12px}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);padding:8px 14px;font-size:14px;white-space:nowrap}
#prompt b{display:inline-block;background:#fac775;color:#633806;border-radius:5px;padding:0 7px;margin-right:6px}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #000}
#keys{right:10px;bottom:10px;font-size:12px;color:#b5d4f4;line-height:1.7}
#keys b{color:#fac775}
#toasts{position:absolute;top:150px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:rgba(4,44,83,.94);border-left:4px solid #fac775;padding:7px 12px;border-radius:6px;font-size:13px;max-width:330px;animation:fade 6s forwards}
.toast.bad{border-color:#e24b4a}.toast.good{border-color:#97c459}
@keyframes fade{0%{opacity:0;transform:translateX(20px)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);opacity:0;transition:opacity 1s}
#sleep{position:fixed;inset:0;background:rgba(2,8,18,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;text-align:center}
#sleep .big{font-size:40px;font-weight:700}
#joy{position:absolute;left:24px;bottom:150px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(250,199,117,.85)}
#mbtns{position:absolute;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(2,72px);gap:8px;pointer-events:auto}
#mbtns button{height:56px;padding:4px;font-size:13px;border-radius:12px;background:rgba(24,95,165,.9)}
#mbtns button.gold{background:#fac775}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,12,24,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
#modal .box{width:min(900px,100%);max-height:92vh;overflow:auto;padding:18px 20px;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#modal h2{font-size:20px;margin-bottom:6px}
#modal h3{font-size:15px;margin:14px 0 6px;color:#fac775}
#modal p,#modal li{font-size:14px;line-height:1.7}
#modal ul{padding-left:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{padding:6px 11px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid rgba(133,183,235,.18);text-align:left;white-space:nowrap}
th{color:#85b7eb;font-weight:500}
.tw{overflow-x:auto}
.ok{color:#97c459}.bad{color:#f09595}.warn{color:#fac775}.mut{color:#85b7eb}.blue{color:#85b7eb}
.card{background:rgba(12,68,124,.55);border:1px solid rgba(133,183,235,.2);border-radius:10px;padding:12px;margin-bottom:10px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid rgba(133,183,235,.25);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px}
.opt input{margin-top:5px}
.err{color:#f09595;font-size:13px;margin-top:6px;min-height:18px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.read{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.read div{background:#0c2a4a;border-radius:8px;padding:8px;text-align:center;font-size:12px;color:#85b7eb}
.read b{display:block;font-size:16px;color:#e6f1fb}
.sld{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tfc{background:#0c2a4a;border:1px solid rgba(133,183,235,.25);border-radius:10px;padding:10px}
.tfc.f{border-color:#e24b4a}.tfc.r{border-color:#fac775}.tfc.d{border-color:#378add}
.tfc h4{font-size:15px;display:flex;justify-content:space-between}
.cbrow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:13px}
.cb{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.cb.cl{background:#e24b4a}.cb.op{background:#639922}
.step{margin-top:8px;font-size:12px;background:rgba(250,199,117,.15);color:#fac775;border-radius:6px;padding:5px 8px}
.setg{display:grid;grid-template-columns:180px 1fr;gap:10px 14px;align-items:center;font-size:14px}
.grade{font-size:56px;font-weight:700;color:#fac775;line-height:1}
/* paper form */
.paper{background:#fbfaf5;color:#1f1f1f;border-radius:4px;padding:22px 24px;font-family:'Sarabun','Noto Sans Thai',sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.paper h2{color:#1f1f1f!important;font-size:18px!important;text-align:center}
.paper .code{text-align:right;font-size:12px;color:#444}
.paper table td,.paper table th{border:1px solid #999;color:#1f1f1f;white-space:normal;padding:6px 8px;font-size:14px}
.paper table th{background:#eceae2;width:30%;font-weight:600}
.paper input,.paper select,.paper textarea{background:transparent;color:#1f1f1f;border:none;border-bottom:1px dotted #555;border-radius:0;padding:3px 4px;font-family:'Sarabun',sans-serif;font-size:15px}
.paper textarea{width:100%;border:1px dotted #999;min-height:46px}
.paper .err{color:#b3261e}
.paper label{color:#1f1f1f}
.sign{font-family:'Brush Script MT',cursive;font-size:20px;color:#173b8a}
@media (max-width:760px){
 #tl,#needs{min-width:0;width:190px;padding:6px 9px}#tl .big{font-size:13px}
 #hLoc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #needs{top:92px}
 #info{display:none}
 #alert{top:auto;bottom:250px;max-width:80vw}
 #avail{display:none}
 #keys{display:none}
 .read,.sld{grid-template-columns:repeat(2,1fr)}
 .setg{grid-template-columns:1fr}
 #toasts{top:auto;bottom:300px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="select">
  <div>
    <h1>RAM Insight · Substation Engineer</h1>
    <div class="sub">เกมจำลองชีวิตวิศวกรดูแลหม้อแปลง · สถานีคอต่อ (KO) · สถานีแพรกษา (PR) · นิคมอุตสาหกรรมบางปู · มิถุนายน 2569</div>
  </div>
  <div id="selBottom">
    <div class="row2"><button id="pickF" class="on">วิศวกรหญิง</button><button id="pickM">วิศวกรชาย</button></div>

    <div class="row2"><select id="selDiff"><option value="easy">ความยาก: ง่าย</option><option value="normal" selected>ความยาก: ปกติ</option><option value="hard">ความยาก: ยาก</option></select></div>
    <button id="startBtn" class="gold" style="width:100%;padding:12px;font-size:16px">เริ่มเกมใหม่</button>
    <button id="contBtn" class="hidden" style="width:100%;padding:10px">เล่นต่อจากที่เซฟไว้</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="tl" class="panel"><div class="big" id="hDate">-</div><div class="small" id="hLoc">-</div><span class="chip out" id="hClock">ยังไม่ตอกบัตร</span></div>
  <div id="needs" class="panel"></div>
  <div id="tr" class="panel"><button id="bPhone">โทรศัพท์<span class="badge hidden" id="badge">0</span></button><button id="bGear">ตั้งค่า</button></div>
  <div id="info" class="panel"></div>
  <div id="alert" class="panel hidden"></div>
  <div id="avail" class="panel"></div>
  <div id="prompt" class="panel hidden"></div>
  <div id="keys" class="panel"><b>WASD</b> เดิน · <b>Shift</b> วิ่ง · <b>เมาส์</b> หันมอง<br><b>E</b> ใช้/ตรวจ · <b>Tab</b> โทรศัพท์ · <b>M</b> ขับรถ<br><b>V</b> สลับมุมมอง · <b>Esc</b> ตั้งค่า</div>
  <div id="toasts"></div>
  <div id="joy" class="hidden"><div id="knob"></div></div>
  <div id="mbtns" class="hidden"><button id="bE" class="gold">ใช้/ตรวจ</button><button id="bTab">โทรศัพท์</button><button id="bV">มุมมอง</button><button id="bM">ขับรถ</button></div>
</div>

<div id="sleep" class="hidden"><div class="big">หลับอยู่…</div><div id="sleepT" class="small" style="font-size:16px"></div><button id="wakeBtn">ตื่น</button></div>
<div id="modal" class="hidden"><div class="box panel" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const rand=(a,b)=>a+Math.random()*(b-a);
const expRand=m=>-Math.log(1-Math.random())*m;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad2=n=>String(n).padStart(2,'0');

/* ================= CONSTANTS ================= */
const MONTH_H=720,START_H=6.5,A_TARGET=0.96,FORM_DEADLINE=72,LEAD=12,BASE_SALARY=30000,HOUR_RATE=BASE_SALARY/30/8;
const DOW=['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
function splitT(h){const d=Math.floor(h/24)+1;const r=h-(d-1)*24;let hh=Math.floor(r),mm=Math.round((r-hh)*60);if(mm===60){mm=0;hh++;}return {d,hh,mm};}
function fmtT(h){const t=splitT(Math.min(h,MONTH_H-1/60));return `${DOW[(t.d-1)%7]} ${t.d} มิ.ย. 69 · ${pad2(t.hh)}:${pad2(t.mm)}`;}
function fmtS(h){const t=splitT(Math.min(h,MONTH_H-1/60));return `${t.d}/06 ${pad2(t.hh)}:${pad2(t.mm)}`;}
function clockS(h){const t=splitT(h);return `${pad2(t.hh)}:${pad2(t.mm)}`;}
const isWork=d=>((d-1)%7)<5;
const baht=n=>(n<0?'-':'')+'฿ '+Math.abs(Math.round(n)).toLocaleString('th-TH');
const pct=v=>(v*100).toFixed(2)+'%';
const DIFFS={easy:{name:'ง่าย',mtbf:1.5,budget:2500000},normal:{name:'ปกติ',mtbf:1,budget:1500000},hard:{name:'ยาก',mtbf:0.7,budget:1000000}};
const STA={KO:{x:-70,name:'สถานีไฟฟ้าย่อยคอต่อ'},PR:{x:70,name:'สถานีไฟฟ้าย่อยแพรกษา'}};
const TF_DEFS=[
 {id:'KO1',st:'KO',kv:'115/24 kV',mtbf:700,lx:-16},{id:'KO2',st:'KO',kv:'115/24 kV',mtbf:600,lx:0},{id:'KO3',st:'KO',kv:'115/24 kV',mtbf:760,lx:16},
 {id:'PR1',st:'PR',kv:'115/24 kV',mtbf:660,lx:-16},{id:'PR2',st:'PR',kv:'115/24 kV',mtbf:720,lx:0},{id:'PR3',st:'PR',kv:'67-115/24 kV',mtbf:540,lx:16}];
const TECH_DEFS=[
 {name:'สมชาย',skill:'ไฟฟ้า',home:'KO',g:'m',skin:0xb97a55,shirt:0x3b6d11},
 {name:'วิทยา',skill:'เครื่องกล',home:'KO',g:'m',skin:0xc98a64,shirt:0x854f0b},
 {name:'สุภาพร',skill:'รีเลย์',home:'PR',g:'f',skin:0xe8a98c,shirt:0x534ab7},
 {name:'อนุชา',skill:'เครื่องกล',home:'PR',g:'m',skin:0xa86b48,shirt:0x0f6e56}];
const PARTS={oltc:{name:'ชุดมอเตอร์ขับ OLTC',price:180000},gasket:{name:'ชุดปะเก็น + น้ำมันหม้อแปลง',price:95000},buchholz:{name:'Buchholz relay + ชุดกรองน้ำมัน',price:140000},fan:{name:'มอเตอร์พัดลมระบายความร้อน',price:45000},bushing:{name:'บุชชิ่ง 115 kV',price:380000},arrester:{name:'Surge arrester 115 kV',price:85000}};
const FAULTS=[
 {k:'oltc',name:'OLTC ขัดข้อง (ชุดขับมอเตอร์)',alarm:'OLTC / Voltage regulation fail',trip:false,part:'oltc',base:6,w:1.2,smoke:false,skill:['ไฟฟ้า','เครื่องกล'],
  sym:['แรงดันด้าน 24 kV ต่ำกว่าเกณฑ์','OLTC ค้างที่ Tap 9 ไม่เปลี่ยนตามคำสั่ง','มีกลิ่นไหม้ที่ตู้ขับ OLTC'],read:{oil:62,wti:78,v:'21.6 kV',b:'ปกติ'},relay:'90 AVR Alarm'},
 {k:'leak',name:'น้ำมันรั่วที่ปะเก็น/วาล์ว',alarm:'Low oil level',trip:false,part:'gasket',base:8,w:1.3,smoke:false,skill:['เครื่องกล'],
  sym:['มีคราบน้ำมันใต้ถังและบนแท่นฐาน','ระดับน้ำมันใน Conservator ต่ำ','ซิลิกาเจลเปลี่ยนสีเร็วผิดปกติ'],read:{oil:68,wti:82,v:'24.1 kV',b:'Alarm'},relay:'Oil level Alarm'},
 {k:'buch',name:'Buchholz relay ทำงาน (แก๊สสะสมในถัง)',alarm:'Main transformer TRIP',trip:true,part:'buchholz',base:12,w:0.8,smoke:true,skill:['เครื่องกล','รีเลย์'],
  sym:['พบแก๊สสะสมในช่องรีเลย์ Buchholz','ผล DGA เบื้องต้นมี C2H2 สูง','ไม่พบรอยไหม้ภายนอก'],read:{oil:74,wti:88,v:'0 kV',b:'Trip'},relay:'63 Buchholz Trip'},
 {k:'fan',name:'พัดลมระบายความร้อนเสีย',alarm:'WTI high temperature',trip:false,part:'fan',base:3,w:1.5,smoke:false,skill:['ไฟฟ้า'],
  sym:['WTI ขึ้นถึง 118°C เกินค่าตั้ง','พัดลมชุดระบายความร้อนไม่หมุน','เบรกเกอร์มอเตอร์พัดลมตัด'],read:{oil:96,wti:118,v:'24.0 kV',b:'ปกติ'},relay:'49 WTI Alarm'},
 {k:'bush',name:'บุชชิ่งแรงสูงวาบไฟ/แตกร้าว',alarm:'Main transformer TRIP',trip:true,part:'bushing',base:16,w:0.6,smoke:true,skill:['ไฟฟ้า'],
  sym:['พบรอยไหม้และรอยร้าวที่บุชชิ่ง HV เฟส B','รีเลย์ Differential (87T) ทำงาน','Buchholz ไม่ทำงาน'],read:{oil:70,wti:84,v:'0 kV',b:'ปกติ'},relay:'87T Differential Trip'},
 {k:'arr',name:'Surge arrester เสียหายจากฟ้าผ่า',alarm:'Earth fault TRIP',trip:true,part:'arrester',base:5,w:1.0,smoke:true,skill:['ไฟฟ้า','รีเลย์'],
  sym:['เคาน์เตอร์ Surge arrester เพิ่มขึ้นหลังพายุฝน','ฉนวนอาร์เรสเตอร์ร้าว มีรอยดำ','รีเลย์ Earth fault ทำงาน'],read:{oil:60,wti:72,v:'0 kV',b:'ปกติ'},relay:'51G Earth fault Trip'}];
const FK=k=>FAULTS.find(f=>f.k===k);

/* ================= SETTINGS ================= */
const SKEY='ramGameV2',SSKEY='ramGameV2Settings';
const S=Object.assign({speed:1,sens:1,invert:false,gfx:isTouch?'low':'med',fov:72,sound:true,vol:0.6,pauseUI:true,third:false},(()=>{try{return JSON.parse(localStorage.getItem(SSKEY))||{};}catch(e){return {};}})());
function saveSettings(){try{localStorage.setItem(SSKEY,JSON.stringify(S));}catch(e){}}

/* ================= RENDERER ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const _mc={};
function M(color,o={}){const k=color+JSON.stringify(o);return _mc[k]||(_mc[k]=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.8,metalness:.1},o)));}
function box(w,h,d,mat,x,y,z,parent,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;if(parent)parent.add(m);return m;}

/* ---------- R/A/M ---------- */
function stats(t){const T=Math.max(G.h-START_H,1);const down=t.downDone+(t.status!=='ok'?G.h-t.failAt:0);const up=T-down;
 const mtbf=t.fails?up/t.fails:null,mttr=t.repairs?t.downDone/t.repairs:null;return {n:t.fails,down,A:clamp(up/T,0,1),mtbf,mttr,R:mtbf?Math.exp(-168/mtbf):1,Mt:mttr?1-Math.exp(-8/mttr):null};}
function recStats(t){const T=Math.max(G.h-START_H,1);const fs=G.forms.filter(f=>f.tf===t.id&&f.submitted&&f.rec.tf===t.id);const down=fs.reduce((a,f)=>a+Math.max(0,f.rec.end-f.rec.start),0);
 const up=T-down,n=fs.length;const mtbf=n?up/n:null,mttr=n?down/n:null;return {n,down,A:clamp(up/T,0,1),mtbf,mttr,R:mtbf?Math.exp(-168/mtbf):1,Mt:mttr&&mttr>0?1-Math.exp(-8/mttr):null};}

/* ---------- timecard & pay ---------- */
function timecard(){
 const days=[];for(let d=1;d<=30;d++)days.push({d,work:isWork(d),first:null,last:null,ot:0,reg:0,late:false,absent:false,forgot:false});
 const present=t=>G.punches.some(p=>p.in<=t&&(p.out===null?G.h:p.out)>=t);
 G.punches.forEach(p=>{const out=p.out===null?G.h:p.out;
  for(let d=Math.floor(p.in/24)+1;d<=Math.min(30,Math.floor((out-1e-6)/24)+1);d++){const D=days[d-1];const s0=Math.max(p.in,(d-1)*24),s1=Math.min(out,d*24);if(s1<=s0)continue;
   if(D.first===null||s0<D.first)D.first=s0;if(D.last===null||s1>D.last)D.last=s1;
   const reg=D.work?Math.max(0,Math.min(s1,(d-1)*24+17)-Math.max(s0,(d-1)*24+8)):0;D.reg+=reg;if(!p.auto)D.ot+=(s1-s0)-reg;if(p.auto)D.forgot=true;}});
 days.forEach(D=>{const b=(D.d-1)*24;if(!D.work)return;
  const any=G.punches.some(p=>p.in<b+17&&(p.out===null?G.h:p.out)>b+8);
  if(!present(b+8+5/60)&&any&&G.h>b+8+5/60)D.late=true;
  if(!any&&G.h>b+17)D.absent=true;});
 const tot={ot:days.reduce((a,D)=>a+D.ot,0),late:days.filter(D=>D.late).length,absent:days.filter(D=>D.absent).length};
 return {days,tot};
}
function payslip(){const {tot}=timecard();const otPay=tot.ot*HOUR_RATE*1.5,lateDed=tot.late*200,absDed=tot.absent*BASE_SALARY/22,ssf=750,adv=G.pay.adv?BASE_SALARY/2:0;
 return {base:BASE_SALARY,otH:tot.ot,otPay,late:tot.late,lateDed,absent:tot.absent,absDed,ssf,adv,net:BASE_SALARY+otPay-lateDed-absDed-ssf-adv};}

/* ================= SIMULATION ================= */
function simulate(dh){
 const steps=Math.max(1,Math.ceil(dh/0.05));const s=dh/steps;
 for(let i=0;i<steps;i++){simStep(s);if(state!=='play')return;}
}
function simStep(dh){
 G.h+=dh;const h=G.h,N=G.needs,sl=!!G.sleeping;
 const atHome=locName().startsWith('บ้านพัก');
 const pending=G.tf.some(t=>t.status==='fault'||t.status==='done');
 if(sl){N.energy+=14*dh;N.food-=2.5*dh;N.stress-=5*dh;}
 else{N.food-=5*dh;N.energy-=(N.food<=0?8:5.5)*(N.stress>80?1.3:1)*dh;N.stress+=(pending?4:(atHome?-6:-1.5))*dh+(N.food<=0?6*dh:0);}
 N.food=clamp(N.food,0,100);N.energy=clamp(N.energy,0,100);N.stress=clamp(N.stress,0,100);
 if(sl&&h>=G.sleeping.until)wake('ตื่นนอนแล้ว');
 if(!sl&&N.energy<=0)collapse();
 // techs
 G.techs.forEach(t=>{t.fatigue=clamp(t.fatigue+(t.busy?6:-3)*dh,0,100);});
 // transformers
 for(const t of G.tf){
  if(t.status==='ok'&&h>=t.nextFail)failTf(t);
  else if(t.status==='fault'){
   if(!t.acked&&!t.reminded&&h-t.failAt>1){t.reminded=true;addMsg('หัวหน้า',`มี alarm ที่ ${t.id} ค้างมาเกิน 1 ชม. ยังไม่มีใครรับทราบ รีบไปดูที่ห้องควบคุมด้วย`,'bad');}
   if(!FK(t.fk).trip&&!t.esc&&(t.cb115||t.cb24)&&h-t.failAt>6){t.esc=true;t.cb115=false;t.cb24=false;logEv(`${t.id} TRIP — protection operated (fault ลุกลาม)`,'bad',t.id);addMsg('ระบบ SCADA',`${t.id} ทริปเพราะปล่อยเหตุไว้นาน ความเสียหายเพิ่มขึ้น`,'bad');beep(4);refreshTf(t);}
  }else if(t.status==='repair'&&h>=t.repairEnd)repairDone(t);
  if(!t.warned96&&h>START_H+72&&stats(t).A<A_TARGET){t.warned96=true;addMsg('หัวหน้า',`Availability ของ ${t.id} ต่ำกว่า 96% แล้ว ระวังด้วยนะ`,'bad');}
 }
 // forms deadline
 G.forms.forEach(f=>{if(!f.submitted&&h-f.created>FORM_DEADLINE){f.submitted=true;f.auto=true;f.rec={tf:f.tf,type:'CM',start:f.trueEnd,end:f.trueEnd,cause:'ไม่ระบุ'};f.flag=true;f.accurate=false;logEv(`ใบ #${f.id} (${f.tf}) เกินกำหนด ช่างกรอกแทน: from = to, สาเหตุไม่ระบุ`,'bad');addMsg('หัวหน้า',`ใบ FM-OPR-06-01 #${f.id} ไม่ส่งภายใน 3 วัน ข้อมูลที่ช่างกรอกแทนใช้วิเคราะห์ไม่ได้`,'bad');}});
 // punch forgot
 const lp=G.punches[G.punches.length-1];
 if(lp&&lp.out===null&&h-lp.in>16){const d=Math.floor(lp.in/24);lp.out=Math.max(lp.in+0.01,Math.min(lp.in+9,d*24+17));lp.auto=true;addMsg('ฝ่ายบุคคล','ลืมตอกบัตรออกงาน ระบบปิดบัตรให้อัตโนมัติ ไม่คิดค่าล่วงเวลาของรอบนั้น','bad');}
 // attendance messages
 const day=Math.floor(h/24)+1,b=(day-1)*24;
 if(isWork(day)&&h>b+8.25&&h<b+17&&!G.stats.lateMsg[day]){const pres=G.punches.some(p=>p.in<=b+8+5/60&&(p.out===null?h:p.out)>=b+8+5/60);if(!pres){G.stats.lateMsg[day]=1;addMsg('หัวหน้า','สายแล้วนะ วันนี้ยังไม่เห็นตอกบัตรเข้างานเลย','bad');}}
 if(isWork(day)&&h>b+17&&!G.stats.absMsg[day]){G.stats.absMsg[day]=1;const any=G.punches.some(p=>p.in<b+17&&(p.out===null?h:p.out)>b+8);if(!any)addMsg('ฝ่ายบุคคล',`วันที่ ${day} ไม่มีบันทึกเข้างาน นับเป็นขาดงาน`,'bad');}
 if(!G.pay.adv&&h>=14*24+17){G.pay.adv=true;G.wallet+=BASE_SALARY/2;addMsg('ฝ่ายบุคคล',`โอนเงินเดือนงวดแรก ${baht(BASE_SALARY/2)} เข้าบัญชีแล้ว`,'good');}
 if(h>=MONTH_H)endGame();
}
function failTf(t){
 const f=pickFault();Object.assign(t,{optOrder:null,status:'fault',fk:f.k,failAt:G.h,acked:false,diag:null,wrong:false,esc:false,reminded:false,crew:[]});t.fails++;
 if(f.trip){t.cb115=false;t.cb24=false;}
 logEv(`${t.id} ${f.trip?'TRIP':'ALARM'} — ${f.alarm}`,'bad',t.id);
 beep(4);if(G.sleeping)wake(`โทรศัพท์ปลุก! ${t.id} ${f.alarm}`);
 const hd=G.h%24,day=Math.floor(G.h/24)+1;const off=!isWork(day)||hd<8||hd>=17;
 addMsg('ระบบ SCADA',`${t.id}: ${f.alarm}${off?' (เรียกตัวนอกเวลางาน)':''}`,'bad');refreshTf(t);
}
function repairDone(t){
 t.status='done';t.crew.forEach(i=>{G.techs[i].busy=false;G.techs[i].job=null;});
 logEv(`${t.id} ช่างแจ้งซ่อมเสร็จ พร้อมจ่ายไฟ (${t.crew.map(i=>TECH_DEFS[i].name).join(', ')})`,'info',t.id);
 addMsg('ทีมช่าง',`${t.id} ซ่อมเสร็จแล้ว ปลดป้ายและสับจ่ายไฟได้`,'good');beep(2,660);refreshTf(t);refreshNPC();
}
function energize(t){
 const dur=G.h-t.failAt;t.downDone+=dur;t.repairs++;
 G.forms.push({id:G.formSeq++,tf:t.id,trueStart:t.failAt,trueEnd:G.h,trueCause:FK(t.fk).name,crew:t.crew.map(i=>TECH_DEFS[i].name),created:G.h,submitted:false,auto:false,rec:null,accurate:false,flag:false});
 logEv(`${t.id} ENERGIZED — กลับมาจ่ายไฟ`,'good',t.id);toast(`${t.id} กลับมาจ่ายไฟแล้ว · อย่าลืมเขียนใบ FM-OPR-06-01`,'good');
 const D=DIFFS[G.diff];Object.assign(t,{status:'ok',fk:null,crew:[],acked:true,diag:null,esc:false});t.nextFail=G.h+Math.max(6,expRand(defOf(t.id).mtbf*D.mtbf));
 refreshTf(t);
}
function collapse(){G.stats.collapse++;G.needs.energy=5;G.needs.stress=clamp(G.needs.stress+20,0,100);player.pos.set(HOME.ox+3.5,0,HOME.oz+3);player.yaw=Math.PI;G.sleeping={until:G.h+6};$('sleep').classList.remove('hidden');if(document.pointerLockElement)document.exitPointerLock();

function op(id,act){
 const t=tfOf(id);
 if(G.needs.energy<25&&Math.random()<0.2){toast('ง่วงจนกดพลาด คำสั่งถูกยกเลิก ลองใหม่อีกครั้ง','bad');G.needs.stress=clamp(G.needs.stress+4,0,100);openScada();return;}
 const busy=t.status==='fault'||t.status==='repair';

 else if(act==='open24'){if(t.status==='ok'){toast('หม้อแปลงทำงานปกติ ไม่มีใบสั่งงานให้ปลด','bad');}else{t.cb24=false;logEv(`${t.id} เปิด CB 24 kV`,'info',t.id);}}
 else if(act==='open115'){if(t.status==='ok'){toast('หม้อแปลงทำงานปกติ ไม่มีใบสั่งงานให้ปลด','bad');}else if(t.cb24)switchErr('ต้องเปิด CB 24 kV (ปลดโหลด) ก่อน CB 115 kV');else{t.cb115=false;logEv(`${t.id} เปิด CB 115 kV`,'info',t.id);}}
 else if(act==='tag'){if(t.cb115||t.cb24)switchErr('ต้องเปิดเบรกเกอร์ทั้งสองก่อนแขวนป้ายห้ามสับ');else{t.tag=true;logEv(`${t.id} แขวนป้ายห้ามสับ`,'info',t.id);}}
 else if(act==='untag'){if(t.status==='repair')switchErr('ห้ามปลดป้ายระหว่างช่างกำลังทำงาน');else{t.tag=false;logEv(`${t.id} ปลดป้ายห้ามสับ`,'info',t.id);}}
 else if(act==='close115'){if(t.tag)switchErr('ยังแขวนป้ายห้ามสับอยู่');else if(busy)switchErr('ยังซ่อมไม่เสร็จ ห้ามจ่ายไฟเข้าหม้อแปลง');else{t.cb115=true;logEv(`${t.id} สับ CB 115 kV`,'info',t.id);}}
 else if(act==='close24'){if(t.tag)switchErr('ยังแขวนป้ายห้ามสับอยู่');else if(busy)switchErr('ยังซ่อมไม่เสร็จ ห้ามจ่ายไฟ');else if(!t.cb115)switchErr('ต้องสับ CB 115 kV ก่อน CB 24 kV');else{t.cb24=true;logEv(`${t.id} สับ CB 24 kV`,'info',t.id);if(t.status==='done')energize(t);}}
 refreshTf(t);openScada();
}
function nextStep(t){
 if(t.status==='fault'){if(!t.acked)return 'รับทราบ alarm ที่จอ SCADA';if(!t.diag)return 'ไปตรวจหน้างานและวินิจฉัยสาเหตุ';if(t.cb24)return 'เปิด CB 24 kV';if(t.cb115)return 'เปิด CB 115 kV';if(!t.tag)return 'แขวนป้ายห้ามสับ';return 'สั่งทีมช่างเข้าซ่อม';}
 if(t.status==='repair')return `ช่างกำลังซ่อม · เสร็จประมาณ ${fmtS(t.repairEnd)}`;
 if(t.status==='done'){if(t.tag)return 'ปลดป้ายห้ามสับ';if(!t.cb115)return 'สับ CB 115 kV';return 'สับ CB 24 kV เพื่อจ่ายไฟ';}
 return '';
}

     ${t.status==='fault'?`<div class="small" style="margin-top:6px">ผลตรวจหน้างาน: ${t.diag?FK(t.diag).name:'<span class="warn">ยังไม่ได้ตรวจ</span>'}</div>`:''}
     ${t.status==='fault'&&t.acked&&t.diag&&!t.cb115&&!t.cb24&&t.tag?`<div class="btnrow"><button class="gold sm" onclick="openDispatch('${t.id}')">สั่งทีมช่าง</button></div>`:''}

function dispatch(id){
 const t=tfOf(id),f=FK(t.fk),diag=FK(t.diag);const crew=[...document.querySelectorAll('input[name=cr]:checked')].map(x=>+x.value);
 if(!crew.length){$('dpErr').textContent='เลือกช่างอย่างน้อย 1 คน';return;}
 const wrong=diag!==f;let cost=0,lead=0;
 if(G.stock[f.part]>0)G.stock[f.part]--;else{cost+=PARTS[f.part].price*1.5;lead=LEAD;}
 const skillOk=crew.some(i=>f.skill.includes(TECH_DEFS[i].skill));const avgF=crew.reduce((a,i)=>a+G.techs[i].fatigue,0)/crew.length;
 let work=f.base*rand(0.85,1.2)*(skillOk?0.85:1.2)*(crew.length>1?1:1.5)*(wrong?1.6:1)*(t.esc?1.3:1);
 let rework=false;if(avgF>70){work*=1.3;if(Math.random()<0.2){work*=1.4;rework=true;}}
 cost+=work*crew.length*1500+(wrong?30000:0);
 t.status='repair';t.repairStart=G.h+0.5;t.repairEnd=t.repairStart+work+lead;t.crew=crew;t.wrong=wrong;
 crew.forEach(i=>{G.techs[i].busy=true;G.techs[i].job=id;});G.budget-=cost;
 logEv(`${id} สั่งงานซ่อม: ${crew.map(i=>TECH_DEFS[i].name).join(', ')} (วินิจฉัย: ${diag.name})`,'info',id);
 toast(`สั่งงานแล้ว · ค่าใช้จ่าย ${baht(cost)}${lead?' · รออะไหล่ '+LEAD+' ชม.':''}`,lead?'bad':'good');
 if(wrong)setTimeout(()=>addMsg('ทีมช่าง',`${id} สาเหตุไม่ตรงกับที่วินิจฉัย ต้องตรวจซ้ำ เวลาซ่อมจะนานขึ้น`,'bad'),2500);
 if(rework)setTimeout(()=>addMsg('ทีมช่าง',`${id} ช่างเหนื่อยมาก งานบางส่วนต้องทำใหม่`,'bad'),5000);
 refreshTf(t);refreshNPC();closeModal();
}

function submitForm(id){
 const f=G.forms.find(x=>x.id===id),e=$('fErr');const tf=$('fTf').value,ty=(document.querySelector('input[name=fTy]:checked')||{}).value,sd=+$('fSd').value,ed=+$('fEd').value,st=$('fSt').value,et=$('fEt').value,cs=$('fCs').value;

 if(!$('fOk').checked){e.textContent='ต้องติ๊กรับรองข้อมูลก่อนลงชื่อ';return;}
 const toH=(d,t)=>{const [hh,mm]=t.split(':').map(Number);return (d-1)*24+hh+mm/60;};const s=toH(sd,st),en=toH(ed,et);
 if(en<s){e.textContent='เวลาแก้ไขเสร็จต้องไม่อยู่ก่อนเวลาเกิดเหตุ';return;}

 f.rec={tf,type:ty,start:s,end:en,cause:cs,act:$('fAct').value};f.submitted=true;f.flag=Math.abs(en-s)<0.01;
 f.accurate=tf===f.tf&&ty==='CM'&&Math.abs(s-f.trueStart)<=0.25&&Math.abs(en-f.trueEnd)<=0.25&&cs===f.trueCause;

}

  if(t.status==='fault')v.lampM.emissiveIntensity=(Math.sin(blink*8)>0)?1.6:0.15;else v.lampM.emissiveIntensity=1;
  if(energized(t)&&t.fk!=='fan')v.fans.forEach(f=>f.rotation.x+=dt*14);
  if(t.status!=='ok'&&FK(t.fk).smoke&&(t.status==='fault'||G.h<t.repairStart+2)){v.smokeT+=dt;if(v.smokeT>0.2){v.smokeT=0;spawnPuff(v);}}}
 for(let i=puffs.length-1;i>=0;i--){const q=puffs[i];q.life+=dt;q.sp.position.y+=dt*1.3;q.sp.position.x+=dt*0.4;const sc=1+q.life*1.2;q.sp.scale.set(sc,sc,1);q.sp.material.opacity=Math.max(0,0.8-q.life*0.27);if(q.life>3){scene.remove(q.sp);q.sp.material.dispose();puffs.splice(i,1);}}
 ['KO','PR'].forEach(c=>{const tr=trucks[c];tr.bm.emissiveIntensity=tr.atJob&&Math.sin(blink*10)>0?2:0;});
 techChars.forEach(c=>{if(c.work){c.armR.rotation.x=-1.2+Math.sin(blink*6)*0.4;c.armL.rotation.x=-0.6;}else{c.armR.rotation.x=0;c.armL.rotation.x=0;}});
 // prompt
 if(state==='play'&&!uiOpen&&!G.sleeping){const it=nearestInteract();if(it){$('prompt').classList.remove('hidden');$('prompt').innerHTML=`<b>${isTouch?'ใช้':'E'}</b>${it.label}`;}else $('prompt').classList.add('hidden');}else $('prompt').classList.add('hidden');
 hudT+=dt;if(hudT>0.25&&G){hudT=0;updateHUD();}
 scT+=dt;if(scT>1){scT=0;drawScada();}
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitSelCam();});
function redrawSigns(){signs.forEach(o=>{const x=o.userData.c.getContext('2d');x.clearRect(0,0,o.userData.c.width,o.userData.c.height);o.userData.draw(x,o.userData.c.width,o.userData.c.height);o.userData.t.needsUpdate=true;});
 techChars.forEach((c,i)=>{const l=c.grp.children.find(o=>o.isSprite);if(l)drawLabel(l,TECH_DEFS[i].name,'ช่าง'+TECH_DEFS[i].skill,'#85b7eb');});drawLabel(chief.label,'คุณประเสริฐ','หัวหน้าสถานี','#fac775');if(G)G.tf.forEach(refreshTf);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawSigns);
addEventListener('beforeunload',()=>saveGame(false));
applyGfx();renderer.setSize(innerWidth,innerHeight);drawScada();
tick();
</script>
